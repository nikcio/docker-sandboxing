schemaVersion: "2"
kind: sandbox
name: opencode-custom
displayName: OpenCode (Custom)
version: 0.5.0

sandbox:
  image: "docker/sandbox-templates:opencode-docker"
  entrypoint: [opencode]

permissions:
  network:
    allow:
      # Ubuntu archives
      - archive.ubuntu.com
      - security.ubuntu.com

      # NPM registry
      - registry.npmjs.org

      # Opencode
      - models.opencode.ai

      # Docker
      - download.docker.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by any HTTPS client (git, curl, node,
      # dotnet) doing revocation checks;
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"

setup:
  startup:
    - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true) &"]
      user: "root"
      description: Update apt package cache in background

    - command:
        - sh
        - -c
        - |
          command -v o >/dev/null 2>&1 && exit 0
          printf '#!/bin/sh\nexec opencode "$@"\n' > /usr/local/bin/o
          chmod 0755 /usr/local/bin/o
      user: "root"
      description: Install the `o` shortcut for relaunching opencode

    # Gateway-first MCP registration. sandboxd injects MCP_GATEWAY_URL +
    # MCP_SENTINEL_TOKEN_NAME into the container env when a gateway has
    # been reserved. The sentinel name is not a credential — the proxy
    # substitutes the real token at request time keyed by this name.
    # No-op when MCP isn't enabled.
    #
    # opencode reads MCP server config from ~/.config/opencode/opencode.json.
    # opencode owns the file (no baseline keys to preserve), so the
    # script writes it fresh via heredoc.
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "mcp": {
              "mcp-gateway": {
                "type": "remote",
                "url": "$MCP_GATEWAY_URL",
                "enabled": true,
                "headers": {
                  "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                }
              }
            }
          }
          EOF
      user: "agent"
      description: Register the sandbox MCP gateway in ~/.config/opencode/opencode.json

agentInstructions:
  filename: AGENTS.md
