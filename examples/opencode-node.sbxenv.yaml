# OpenCode sandbox environment (Node).
#
# 1. Copy this file into your project's root and rename it sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the kit lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
agent: opencode

# The built-in opencode agent plus the mixins your project needs. Each
# mixin brings its own locale env and network rules; the stack mixin
# installs the toolchain. Refs are pinned to the latest release;
# release-please bumps them (do not edit by hand).
# x-release-please-start-version
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode&ref=v2.3.0          # OpenCode CLI + config + provider merge (required with model providers)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/env-guard&ref=v2.3.0              # workspace .env guard
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-update&ref=v2.3.0        # opencode auto-update (latest npm release at creation)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-zeldoc&ref=v2.3.0                 # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/github-cli&ref=v2.3.0             # git push auth (proxy-managed GitHub token)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/node&ref=v2.3.0                   # node/npm
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)
