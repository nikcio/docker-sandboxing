# OpenCode sandbox environment (.NET).
#
# 1. Copy this file into your project's root and rename it sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the kit lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
agent: opencode-dotnet

# The sandbox kit plus the mixins your project needs. Refs point at the
# repo's default branch so the examples track development; pin &ref=<tag>
# to a release when you copy this file (release-please bumps the pins).
# x-release-please-start-version
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-dotnet&ref=main     # agent definition (published image)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/agents-md&ref=main              # sandbox AGENTS.md baseline (required by the kit)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/global-opencode-config&ref=main # permissive OpenCode config + provider merge (required with model providers)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/env-guard&ref=main              # workspace .env guard
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-update&ref=main        # opencode auto-update (latest npm release at creation)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/zeldoc&ref=main                 # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/github-cli&ref=main             # git push auth (proxy-managed GitHub token)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/node&ref=main                   # node/npm
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/dotnet&ref=main                 # .NET/NuGet
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/docker-hub&ref=main             # in-sandbox docker (Docker Hub registry egress)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/browser&ref=main                # Google Chrome
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/playwright&ref=main             # Playwright + Chromium headless shell
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

env:
  NODE_ENV: development

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 5000 # ASP.NET / dotnet run
    host: 5000
  - sandbox: 3000 # node / vite dev server
    host: 3000

# Approves GitHub token injection for the sandbox (docs/github-pat.md).
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
