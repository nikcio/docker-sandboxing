# Example Docker Sandboxes environment file for the opencode-node-dotnet kit.
#
# Copy this NEXT TO your project directory (keep it OUTSIDE every mounted
# workspace) and adjust the paths, then run:  sbx env run
#
#   my-project-env/
#   ├── .sbxenv.yaml          <- this file, renamed
#   └── my-project/           <- your code (becomes the workspace)
#
# See https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
# The agent defined by this repo's sandbox kit (kit/spec.yaml `name:`).
agent: opencode-node-dotnet
# Composition: the sandbox kit (template + entrypoint) plus the area-specific
# mixins you want. Drop or add lines to scope the sandbox to your project —
# each mixin only contributes its own network rules, settings, and notes.
# Git refs are pinned to the latest release (&ref=vX.Y.Z); release-please
# bumps the pins with each release. The agent kit is the published variant
# (kit-published/), whose sandbox.image points at the public image on
# Docker Hub pushed by the release workflow.
# When iterating from a clone, swap any ref for a local dir (e.g. ./kit).
# x-release-please-start-version
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-published&ref=v0.6.0           # agent definition (published image)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-runtime&ref=v0.6.0 # agent runtime
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/zeldoc&ref=v0.6.0           # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/git&ref=v0.6.0              # git + worktrees
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/node&ref=v0.6.0             # node/npm
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/dotnet&ref=v0.6.0           # .NET/NuGet
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/docker&ref=v0.6.0           # in-sandbox docker
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/apt&ref=v0.6.0              # apt mirrors
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/browser&ref=v0.6.0          # Google Chrome
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/playwright&ref=v0.6.0       # Playwright + Chromium headless shell
# x-release-please-end-version
workspace: ./my-project

env:
  NODE_ENV: development

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 5000 # ASP.NET / dotnet run
    host: 5000
  - sandbox: 3000 # node / vite dev server
    host: 3000
