# OpenCode sandbox environment (Go).
#
# 1. Copy this file into your project's root and rename it sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the mixin lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project

# The workload kit (agent:) and the mixin refs are pinned to the latest
# release; release-please bumps them (do not edit by hand).
# x-release-please-start-version
agent: docker.io/nikcio/sbx-kit-go:v2.2.0

kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode&ref=v2.2.0        # opencode agent + config + provider merge (required)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/launch-opencode&ref=v2.2.0        # launch opencode at startup
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/env-guard&ref=v2.2.0        # workspace .env guard
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-zeldoc&ref=v2.2.0        # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/github-cli&ref=v2.2.0        # git push auth (proxy-managed GitHub token)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/go&ref=v2.2.0        # Go toolchain (module proxy egress)
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 8080 # net/http / gin / echo dev server
    host: 8080
  - sandbox: 3000 # fiber / frontend dev server
    host: 3000

# Approves GitHub token injection for the sandbox (docs/github-pat.md).
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
