# OpenCode sandbox environment (Go).
#
# 1. Copy this file into your project's root and rename it sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the kit lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# The go mixin owns the Go toolchain egress: the module proxy (go get,
# go mod download, go install, GOTOOLCHAIN toolchain downloads), the
# checksum database, and the go.dev/golang.org docs sites.
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
agent: opencode-go

# The sandbox kit plus the mixins your project needs. Refs are pinned to the
# latest release; release-please bumps them (do not edit by hand).
# x-release-please-start-version
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-go&ref=v1.1.2              # agent definition (published image)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/agents-md&ref=v1.1.2              # sandbox AGENTS.md baseline (required by the kit)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/global-opencode-config&ref=v1.1.2 # permissive OpenCode config + provider merge (required with model providers)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/env-guard&ref=v1.1.2              # workspace .env guard
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-update&ref=v1.1.2        # opencode auto-update (latest npm release at creation)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/zeldoc&ref=v1.1.2                 # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/github-cli&ref=v1.1.2             # git push auth (proxy-managed GitHub token)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/go&ref=v1.1.2                     # Go toolchain (module proxy egress)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/docker-hub&ref=v1.1.2             # in-sandbox docker (Docker Hub registry egress)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/browser&ref=v1.1.2                # Google Chrome
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/playwright&ref=v1.1.2             # Playwright + Chromium headless shell
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 8080 # net/http / gin / echo dev server
    host: 8080
  - sandbox: 3000 # fiber / frontend dev server
    host: 3000

# Approves GitHub token injection for the sandbox (docs/github-pat.md).
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
