# OpenCode sandbox environment (Python + uv).
#
# 1. Copy this file into your project's root and rename it .sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the kit lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# The python mixin owns PyPI egress for uv/pip; interpreter downloads via
# `uv python install` ride the git mixin's GitHub egress (mixins/python).
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
agent: opencode-python

# The sandbox kit plus the mixins your project needs. Refs are pinned to the
# latest release; release-please bumps them (do not edit by hand).
# x-release-please-start-version
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-published-python&ref=v0.7.0                     # agent definition (published image)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/base&ref=v0.7.0                              # agent guidance + AGENTS.md rebuild + MCP gateway (required by the kit)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-config&ref=v0.7.0                   # permissive OpenCode config (required by the kit)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-entrypoint&ref=v0.7.0               # entrypoint runtime (required by the kit)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-runtime&ref=v0.7.0                  # agent runtime
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/zeldoc&ref=v0.7.0                            # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/git&ref=v0.7.0                               # git + worktrees
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/python&ref=v0.7.0                            # Python toolchain (PyPI egress)
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/docker&ref=v0.7.0                            # in-sandbox docker
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/apt&ref=v0.7.0                               # apt mirrors
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/browser&ref=v0.7.0                           # Google Chrome
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/playwright&ref=v0.7.0                        # Playwright + Chromium headless shell
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

env:
  PYTHONUNBUFFERED: 1 # stream logs instead of buffering stdout

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 8000 # uvicorn / fastapi dev server
    host: 8000
  - sandbox: 5000 # flask / django runserver
    host: 5000

# Approves GitHub token injection for the sandbox (docs/github-pat.md).
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
