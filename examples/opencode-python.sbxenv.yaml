# OpenCode sandbox environment (Python + uv).
#
# 1. Copy this file into your project's root and rename it sbxenv.yaml
#    (commit it so teammates get the same sandbox).
# 2. Adjust `name:` below and drop the kit lines your project doesn't need
#    (see ../docs/mixins.md).
# 3. Run from your project root:  sbx env run
#
# Full guide: ../docs/getting-started.md
# Environment file docs: https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: my-project
agent: docker.io/nikcio/sbx-kit-opencode-python:v3.0.0

# The workload kit is selected by `agent:` above; these are the mixins.
# Refs are pinned to the latest release; release-please bumps them (do
# not edit by hand).
# x-release-please-start-version
kits:
  - docker.io/nikcio/sbx-mixin-agents-md:v3.0.0              # sandbox AGENTS.md baseline (required by the kit)
  - docker.io/nikcio/sbx-mixin-global-opencode-config:v3.0.0 # permissive OpenCode config + provider merge (required with model providers)
  - docker.io/nikcio/sbx-mixin-env-guard:v3.0.0              # workspace .env guard
  - docker.io/nikcio/sbx-mixin-opencode-update:v3.0.0        # opencode auto-update (latest npm release at creation)
  - docker.io/nikcio/sbx-mixin-zeldoc:v3.0.0                 # Zeldoc.ai provider
  - docker.io/nikcio/sbx-mixin-github-cli:v3.0.0             # git push auth (proxy-managed GitHub token)
  - docker.io/nikcio/sbx-mixin-python:v3.0.0                 # Python toolchain (PyPI egress)
# x-release-please-end-version

workspace:
  path: . # the repo itself; point elsewhere if the env file sits outside the project
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

env:
  PYTHONUNBUFFERED: 1 # stream logs instead of buffering stdout

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 8000 # uvicorn / fastapi dev server
    host: 8000
  - sandbox: 5000 # flask / django runserver
    host: 5000

bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
