# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Shell (Go)
description: Shell workload with the Go toolchain baked in (agent user,
  workspace, persistent shell). Launches bash; compose the
  launch-opencode mixin to run OpenCode instead.

# The version is bumped by release-please (the tag the examples pin).
# x-release-please-start-version
version: "2.2.0"
# x-release-please-end-version

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-context@1
    config:
      filename: AGENTS.md
