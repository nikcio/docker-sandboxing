# Sandbox kit: OpenCode agent on the go template.
#
# DEV VARIANT — sandbox.image is the locally built template (see
# scripts/bootstrap.*). Remote consumers use ../kit-published-go/
# (public image on Docker Hub, bumped by release-please).
#
# The kit is intentionally thin: template image + entrypoint. Everything
# shared across the kits lives in ../mixins/base/ — the entrypoint runtime
# (banner, opencode upgrade + autostart, .env guard, AGENTS.md rebuild),
# the permissive OpenCode config, the agent guidance files, and the
# startup hooks. Every sandbox using this kit must compose that mixin;
# the entrypoint below execs the shared script and refuses to start (with
# a clear error) if it is missing. Compose further capabilities at launch
# with the mixins from ../mixins/ via --kit flags or a .sbxenv.yaml kits:
# list (the spec's `mixins:` field is not applied by the runtime yet).
# See ../docs/.
#
# Validate: sbx kit validate kit-go/
schemaVersion: "2"
kind: sandbox
name: opencode-go
displayName: OpenCode (Go)
description: >
  OpenCode agent running on a custom template with the Go toolchain preinstalled. Ships the permissive OpenCode config (edit/bash/webfetch allowed —
  the sandbox is the isolation boundary), the agent guidance files, and
  the entrypoint runtime through the shared baseline mixin (../mixins/base,
  required). The entrypoint is a login shell: it prints a startup banner,
  upgrades opencode to the newest release (best-effort), auto-starts it,
  and drops into the shell when opencode exits (relaunch with `o`).
  Compose the mixins from ../mixins/ to add capabilities (model provider,
  network areas, workflow rules). Enforces a no-.env policy in the
  workspace: refuses to start in direct mode when one exists, removes it
  in clone mode.
version: 0.1.0

sandbox:
  # Local template built from ../template-go/Dockerfile. A registry push
  # needs the full reference (e.g. docker.io/<org>/opencode-go:v1).
  image: opencode-go:v1
  # Wrapper: the real runtime lives in the base mixin
  # (~/.sandbox-kit/entrypoint.sh) — see that script for the behavior
  # (banner, best-effort opencode upgrade, auto-start opencode, drop into
  # the shell when opencode exits; quitting the shell ends the session).
  entrypoint:
    - bash
    - -c
    - |
      if [ -f "$HOME/.sandbox-kit/entrypoint.sh" ]; then
        exec bash "$HOME/.sandbox-kit/entrypoint.sh"
      fi
      echo "ERROR [entrypoint]: $HOME/.sandbox-kit/entrypoint.sh is missing." >&2
      echo "This kit requires the shared baseline mixin (mixins/base) in the sandbox's kits list." >&2
      echo "Add it and recreate the sandbox." >&2
      exec bash -il

# The runtime's generated AGENTS.md baseline can't be replaced from the kit
# grammar — the shared entrypoint script rebuilds the file instead (the
# base mixin's ~/.sandbox-agents.md + every mixin note in
# ~/.sbx-agents.d/).
agentInstructions:
  filename: AGENTS.md
