[package]
name = "sandy"
version = "0.1.0"
description = "Sandy — a friendly command center for Docker Sandboxes"
authors = ["nikcio"]
edition = "2024"
rust-version = "1.99"

[lib]
name = "sandy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
  "wry",
  "compression",
  "common-controls-v6",
  "dynamic-acl",
  "macos-private-api",
  "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
reqwest = { version = "=0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "query",
  "rustls",
] }
serde_yaml_ng = "=0.10.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Guardrails: stricter than the compiler defaults, so panicky or
# error-swallowing patterns fail the build (clippy runs with -D warnings in
# CI) instead of surfacing at runtime. Test code is exempt below.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
# Error-handling hygiene: no panics hidden behind unwrap()/expect() in
# production paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Silence over things that should stay loud.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
