[package]
name = "sandy"
version = "0.1.0"
description = "Sandy — a friendly command center for Docker Sandboxes"
authors = ["docker-sandboxing contributors"]
edition = "2021"

[lib]
name = "sandy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde_yaml_ng = "=0.10.0"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
