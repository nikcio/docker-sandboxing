[package]
name = "sandy"
version = "0.1.0"
description = "Sandy — a friendly command center for Docker Sandboxes"
authors = ["docker-sandboxing contributors"]
edition = "2021"

[lib]
name = "sandy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "8"

[profile.release]
codegen-units = 1
lto = true
strip = true
