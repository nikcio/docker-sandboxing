<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#457b9d"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#dda15e"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fefae0"/>
      <stop offset="1" stop-color="#f4c95d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="368" cy="128" r="52" fill="#fefae0" opacity="0.9"/>
  <!-- back dune -->
  <path d="M0 340 C 90 250, 190 250, 262 316 C 330 378, 420 380, 512 320 L512 512 L0 512 Z" fill="url(#dune1)"/>
  <!-- front dune with crest -->
  <path d="M0 420 C 70 340, 150 330, 216 380 C 270 420, 380 430, 512 372 L512 512 L0 512 Z" fill="url(#dune2)"/>
  <!-- wind ripple -->
  <path d="M60 470 C 130 448, 220 462, 300 452 C 350 446, 410 452, 452 444" fill="none" stroke="#dda15e" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
</svg>
