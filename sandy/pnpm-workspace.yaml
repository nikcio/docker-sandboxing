packages:
  - "."

# Project settings — these take precedence over any user/global pnpm config.
# Reject packages published less than 24 hours ago (supply-chain protection).
allowBuilds:
  esbuild: true
minimumReleaseAge: 1440
# All versions are pinned exactly; no caret/tilde ranges.
savePrefix: ""
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
