# Sandbox kit: OpenCode agent on the python template.
#
# DEV VARIANT — sandbox.image is the locally built template (see
# scripts/bootstrap.*). Remote consumers use ../kit-published-python/
# (public image on Docker Hub, bumped by release-please).
#
# The kit is intentionally thin: template image + entrypoint. Everything
# shared across the kits lives in ../mixins/ as small, pick-and-choose
# mixins — this kit requires these three:
# - ../mixins/base/ — the entrypoint runtime (mixin hook runner, opencode
#   autostart, login shell on exit), agent guidance files, the AGENTS.md
#   rebuild hook, and the MCP gateway registration
# - ../mixins/global-opencode-config/ — the permissive OpenCode config
#   and the combined provider config (OPENCODE_CONFIG merge)
# - ../mixins/env-guard/ — the workspace .env guard
# Optional: ../mixins/banner/ — the startup banner (the examples compose
# it). The entrypoint below execs the shared runtime script and refuses
# to start (with a clear error) if the base mixin is missing. Compose
# further capabilities at launch with the mixins from ../mixins/ via
# --kit flags or a .sbxenv.yaml kits: list (the spec's `mixins:` field is
# not applied by the runtime yet). See ../docs/.
#
# Validate: sbx kit validate kit-python/
schemaVersion: "2"
kind: sandbox
name: opencode-python
displayName: OpenCode (Python)
description: >
  OpenCode agent running on a custom template with Python (uv-managed CPython) and uv preinstalled. Requires the shared mixins (../mixins/base,
  ../mixins/global-opencode-config, ../mixins/env-guard): the entrypoint
  runs the composed mixins' hooks and auto-starts opencode (login shell
  on exit — relaunch with `o`); the base mixin also rebuilds the sandbox
  AGENTS.md and registers the MCP gateway; the config mixin ships the
  permissive OpenCode config (edit/bash/webfetch allowed — the sandbox is
  the isolation boundary) and merges the model providers; the env-guard
  mixin owns the no-.env policy below. ../mixins/banner adds the startup
  banner.
  Compose the mixins from ../mixins/ to add capabilities (model provider,
  network areas, workflow rules). Enforces a no-.env policy in the
  workspace: refuses to start in direct mode when one exists, removes it
  in clone mode.
version: 0.1.0

sandbox:
  # Local template built from ../template-python/Dockerfile. A registry push
  # needs the full reference (e.g. docker.io/<org>/opencode-python:v1).
  image: opencode-python:v1
  # Wrapper: the real runtime lives in the base mixin
  # (~/.sandbox-kit/entrypoint.sh) — see that script for the behavior
  # (mixin hooks, auto-start opencode, drop into the shell when opencode
  # exits; quitting the shell ends the session).
  entrypoint:
    - bash
    - -c
    - |
      if [ -f "$HOME/.sandbox-kit/entrypoint.sh" ]; then
        exec bash "$HOME/.sandbox-kit/entrypoint.sh"
      fi
      echo "ERROR [entrypoint]: $HOME/.sandbox-kit/entrypoint.sh is missing." >&2
      echo "This kit requires the shared mixins in the sandbox's kits list:" >&2
      echo "mixins/base (entrypoint runtime, guidance + MCP gateway)," >&2
      echo "mixins/global-opencode-config (config + provider merge)," >&2
      echo "mixins/env-guard (.env guard)." >&2
      echo "Add them and recreate the sandbox." >&2
      exec bash -il

# The runtime's generated AGENTS.md baseline can't be replaced from the kit
# grammar — the base mixin's rebuild hook rewrites the file instead (the
# base mixin's ~/.sandbox-agents.md + every mixin note in
# ~/.sbx-agents.d/); the entrypoint runtime sources it before opencode
# starts.
agentInstructions:
  filename: AGENTS.md
