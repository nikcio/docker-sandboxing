# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: AGENTS.md override
description: >
  Replaces the runtime-generated AGENTS.md baseline with the sandbox
  baseline: the index page (~/.sandbox-agents.md, contributed to the
  profile via agent-context) plus the guidance files
  (~/.sandbox-agents/*.md, shipped as files).
version: "0.2.0"

capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./files/home/.sandbox-agents.md
