schemaVersion: "2"
kind: mixin
name: sbx
displayName: sbx CLI (Docker Sandboxes)
description: >
  Installs the Docker Sandboxes CLI (docker-sbx).
version: 0.3.0

args:
  sbxVersion:
    default: ""
    description: Docker Sandboxes CLI (docker-sbx) apt package version to install (empty = latest apt candidate)
    pattern: '^$|^[0-9][0-9A-Za-z.+~:-]*$'

setup:
  install:
    - command: >
        if command -v sbx >/dev/null 2>&1; then exit 0; fi
        && install -m 0755 -d /etc/apt/keyrings
        && curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
        && install -m 0755 -d /var/lib/apt/sbx-lists
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq
        && SBX_PKG="docker-sbx"
        && SBX_SPEC="${{ kit.args.sbxVersion }}"
        && if [ -n "${SBX_SPEC}" ]; then SBX_PKG="docker-sbx=${SBX_SPEC}"; fi
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y --no-install-recommends ${SBX_PKG}
        && rm -rf /var/lib/apt/sbx-lists
      description: Install the sbx CLI (skipped when the base image already has it)

permissions:
  network:
    allow:
      # Docker apt repo (docker-sbx package + keyring; kept for upgrades)
      - download.docker.com:443

      # Ubuntu apt mirrors: the install step calls apt-get when the
      # base image lacks the tool. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"
