schemaVersion: "2"
kind: mixin
name: sbx
displayName: sbx CLI (Docker Sandboxes)
description: >
  Installs the Docker Sandboxes CLI (docker-sbx).
version: 0.2.1

setup:
  install:
    - command: >
        if command -v sbx >/dev/null 2>&1; then exit 0; fi
        && install -m 0755 -d /etc/apt/keyrings
        && curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
        && install -m 0755 -d /var/lib/apt/sbx-lists
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y --no-install-recommends docker-sbx
        && rm -rf /var/lib/apt/sbx-lists
      description: Install the sbx CLI (skipped when the template image already has it)

permissions:
  network:
    allow:
      # Docker apt repo (docker-sbx package + keyring; kept for upgrades)
      - download.docker.com:443
