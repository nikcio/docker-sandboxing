schemaVersion: "2"
kind: mixin
name: github-cli
displayName: GitHub CLI
description: >
  Installs Github CLI
version: 0.4.0

setup:
  install:
    - command: >
        if command -v gh >/dev/null 2>&1; then exit 0; fi
        && install -m 0755 -d /etc/apt/keyrings
        && curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
        && chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
        && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
        && install -m 0755 -d /var/lib/apt/sbx-lists
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y --no-install-recommends gh
        && rm -rf /var/lib/apt/sbx-lists
      description: Install the gh CLI (skipped when the template image already has it)

  startup:
    # Force git committer identity from GH_TOKEN and prevent the agent from overriding it
    # Note: This isn't perfect as the agent can still override the identity by calling the git binary directly.
    - command:
        - bash
        - -c
        - |
          set -e
          agent_home=/home/agent
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not available; skipping git identity setup" >&2
            exit 0
          fi
          login="$(gh api user --jq .login)" || {
            echo "Could not resolve GitHub user from GH_TOKEN; skipping git identity setup" >&2
            exit 0
          }
          name="$(gh api user --jq '.name // .login')"
          email="$(gh api user --jq '.email // ""')"
          if [ -z "$email" ]; then
            echo "ERROR: GitHub account has no public email set; cannot configure git committer identity" >&2
            exit 1
          fi
          export HOME="$agent_home"
          git config --global user.name "$name"
          git config --global user.email "$email"
          git config --global --add safe.directory '*'
          {
            echo "GIT_AUTHOR_NAME=\"$name\""
            echo "GIT_AUTHOR_EMAIL=\"$email\""
            echo "GIT_COMMITTER_NAME=\"$name\""
            echo "GIT_COMMITTER_EMAIL=\"$email\""
          } > /etc/git-identity
          chmod 644 /etc/git-identity
          {
            echo '#!/bin/bash'
            echo 'if [ -r /etc/git-identity ]; then'
            echo '  set -a'
            echo '  . /etc/git-identity'
            echo '  set +a'
            echo 'fi'
            echo 'if [ "$1" = "config" ]; then'
            echo '  nargs=0'
            echo '  for arg in "$@"; do'
            echo '    case "$arg" in'
            echo '      --*) ;;'
            echo '      config) ;;'
            echo '      *) nargs=$((nargs + 1)) ;;'
            echo '    esac'
            echo '  done'
            echo '  case "$*" in'
            echo '    *user.name*|*user.email*)'
            echo '      if [ "$nargs" -ge 2 ]; then'
            echo '        echo "ERROR: git identity is managed by the sandbox and cannot be overridden" >&2'
            echo '        exit 1'
            echo '      fi'
            echo '      ;;'
            echo '  esac'
            echo 'fi'
            echo 'exec /usr/bin/git "$@"'
          } > /usr/local/bin/git
          chmod 755 /usr/local/bin/git
          {
            echo '[user]'
            echo "	name = $name"
            echo "	email = $email"
          } > /etc/gitconfig
          chown root:root /etc/gitconfig
          chmod 644 /etc/gitconfig
          chattr +i /etc/gitconfig 2>/dev/null || true
          chown root:root "$agent_home/.gitconfig" 2>/dev/null || true
          chmod 644 "$agent_home/.gitconfig" 2>/dev/null || true
          chattr +i "$agent_home/.gitconfig" 2>/dev/null || true
      user: "root"
      description: Force git committer identity from GH_TOKEN and prevent the agent from overriding it

credentials:
  - service: github
    description: >
      GitHub personal access token for the gh CLI and git over HTTPS.
      Use a fine-grained PAT scoped to only the repositories and
      permissions the agent needs.
    required: false
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          header: Authorization
          format: Bearer %s
        - domain: github.com
          header: Authorization
          format: Bearer %s
        - domain: uploads.github.com
          header: Authorization
          format: Bearer %s
        - domain: raw.githubusercontent.com
          header: Authorization
          format: Bearer %s

permissions:
  network:
    allow:
      # gh CLI apt repo (package + keyring; kept for upgrades)
      - cli.github.com:443

      - github.com
      - "*.github.com"
      - "*.githubusercontent.com"