# Playwright mixin (level 3 of 3): Playwright + Chromium, Firefox, WebKit.
#
# Everything Playwright can drive, preinstalled. Large download (~1 GB+) and
# slower sandbox creation — pick ../playwright/ or ../playwright-chromium/ if
# Chromium alone is enough. Needs the apt mixin for the OS libraries
# (--with-deps).
#
# Browser binaries land in /home/agent/.cache/ms-playwright (the agent
# user's default lookup path; installed as root, then chowned).
schemaVersion: "2"
kind: mixin
name: playwright-all
displayName: Playwright (Chromium + Firefox + WebKit)
description: >
  Playwright installed globally via npm with Chromium, Firefox, and WebKit
  preinstalled (~1 GB+ download). Needs the apt mixin for the OS libraries
  (--with-deps).
version: 0.1.0

setup:
  install:
    # unset NPM_CONFIG_PREFIX: the template sets it for its own npm-global
    # dir, and nvm-managed npm refuses to run while it is set.
    - command: >
        unset NPM_CONFIG_PREFIX
        && npm install -g playwright
        && PLAYWRIGHT_BROWSERS_PATH=/home/agent/.cache/ms-playwright npx playwright install --with-deps chromium firefox webkit
        && chown -R agent:agent /home/agent/.cache/ms-playwright

permissions:
  network:
    allow:
      # npm package install (also covered by the node mixin — rules union)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
      # Playwright browser downloads (current CDN + legacy azureedge)
      - cdn.playwright.dev:443
      - "*.cdn.playwright.dev:443"
      - playwright.azureedge.net:443

# Agent memory note: files/home/.sbx-agents.d/playwright-all.md (appended to
# the sandbox AGENTS.md by the kit entrypoint).
