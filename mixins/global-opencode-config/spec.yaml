schemaVersion: "2"
kind: mixin
name: global-opencode-config
displayName: Global OpenCode config
description: >
  Adds permissive opencode config and the ability to merge configs from other mixins using fragments (enabled_*/disabled_* lists union), plus the sandbox baseline (~/.sandbox-agents.md and ~/.sandbox-agents/) and every composed mixin's note in ~/.sbx-agents.d/ rebuilt into the workspace AGENTS.md.
version: 0.5.0

environment:
  variables:
    # The generated config from this mixin
    OPENCODE_CONFIG: /home/agent/.config/opencode/sandbox-mixins.jsonc

setup:
  startup:
    - command:
        - bash
        - -c
        - |
          set -euo pipefail

          FRAG_DIR="${OPENCODE_MIXINS_DIR:-$HOME/.config/opencode/mixins.d}"
          OUT="${1:-$HOME/.config/opencode/sandbox-mixins.jsonc}"

          mkdir -p "$(dirname "$OUT")"

          seed() {
              # Nothing to merge: write the minimal valid config so OPENCODE_CONFIG
              # always points at a loadable file.
              printf '{\n  "$schema": "https://opencode.ai/config.json"\n}\n'
          }

          fail() {
              echo "ERROR [mixins-config]: $*" >&2
              exit 1
          }

          if [ ! -d "$FRAG_DIR" ]; then
              seed > "$OUT"
              echo "[mixins-config] no mixins fragments ($FRAG_DIR missing) — wrote the empty combined config"
              exit 0
          fi

          shopt -s nullglob
          fragments=("$FRAG_DIR"/*.json)
          jsonc=("$FRAG_DIR"/*.jsonc)
          shopt -u nullglob

          if [ "${#jsonc[@]}" -gt 0 ]; then
              fail "comment-bearing fragments are not supported: ${jsonc[*]} — mixins fragments in $FRAG_DIR must be comment-free .json (jq does the merging)"
          fi

          if [ "${#fragments[@]}" -eq 0 ]; then
              seed > "$OUT"
              echo "[mixins-config] no mixins fragments in $FRAG_DIR — wrote the empty combined config"
              exit 0
          fi

          tmp="$(mktemp "$(dirname "$OUT")/.sandbox-mixins.jsonc.XXXXXX")"
          tmp_wrapped="${tmp}.wrapped"
          trap 'rm -f "$tmp" "$tmp_wrapped"' EXIT

          if command -v jq > /dev/null 2>&1; then
              for f in "${fragments[@]}"; do
                  if ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
                      fail "$f is not a valid JSON object — fix or remove it (the previous combined config was left in place)"
                  fi
              done
              # Object values merge recursively; later fragments win scalar
              # conflicts (jq's `*`). Array-valued keys whose name starts
              # with "enabled_" or "disabled_" (e.g. enabled_mixins,
              # enabled_providers) are unioned instead — that is what lets
              # mixins compose (zeldoc + copilot both stay enabled).
              jq -s '
              def unionkey:
                  [keys[] | select(test("^enabled_|^disabled_"))] | .[];
              reduce .[] as $f (
                  {};
                  . as $acc
                  | (. * $f)
                  + (reduce ($f | unionkey) as $k ({};
                      .[$k] = ((($acc[$k] // []) + ($f[$k] // [])) | unique)))
              )
              ' "${fragments[@]}" > "$tmp"
          elif [ "${#fragments[@]}" -eq 1 ]; then
              # jq-less fallback: a single fragment needs no merging.
              cp -- "${fragments[0]}" "$tmp"
          else
              fail "jq is not available and there are ${#fragments[@]} fragments to merge — install jq (the template images ship it)"
          fi

          {
              printf '// GENERATED by the global-opencode-config mixin startup command — do not edit.\n'
              printf '// Fragments: %s\n' "$(basename -a "${fragments[@]}" | paste -sd' ' -)"
              printf '// Edit the owning mixin in docker-sandboxing (or a mixins.d/ fragment) and restart the sandbox.\n'
              cat "$tmp"
          } > "${tmp}.wrapped"
          mv -f "${tmp}.wrapped" "$OUT"

          echo "[mixins-config] merged ${#fragments[@]} mixins fragment(s) ($(basename -a "${fragments[@]}" | paste -sd' ' -)) -> $OUT"

          __agents="$(dirname "${WORKSPACE_DIR:-}")/AGENTS.md"
          __mine="$HOME/.sandbox-agents.md"
          if [ -n "${WORKSPACE_DIR:-}" ] && [ -f "$__agents" ] && [ -f "$__mine" ]; then
            __start_line="$(grep -n '<!-- sbx:kits-section start -->' "$__agents" | tail -n 1 | cut -d: -f1)"
            __end_line="$(grep -n '<!-- sbx:kits-section end -->' "$__agents" | tail -n 1 | cut -d: -f1)"
            __kits=""
            if [ -n "$__start_line" ] && [ -n "$__end_line" ] && [ "$__end_line" -gt "$__start_line" ] 2>/dev/null; then
              __kits="$(sed -n "${__start_line},${__end_line}p" "$__agents")"
            fi
            {
              sed '/<!-- sbx:kits-section start -->/,/<!-- sbx:kits-section end -->/d' "$__mine"
              for __note in "$HOME"/.sbx-agents.d/*.md; do
                [ -f "$__note" ] || continue
                if grep -q 'sbx:kits-section' "$__note"; then
                  echo "WARNING [global-opencode-config]: skipping ${__note} — it contains sbx:kits-section markers (kits-sections are runtime-owned)" >&2
                  continue
                fi
                printf '\n'
                cat "$__note"
              done
              if [ -n "$__kits" ]; then printf '\n%s\n' "$__kits"; fi
            } > "$__agents"
          fi
      user: "agent"
      description: Merge mixins fragments into the combined OPENCODE_CONFIG and rebuild the workspace AGENTS.md baseline (sandbox baseline + mixin notes, Kits index preserved)
