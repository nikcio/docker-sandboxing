# Global OpenCode config: the permissive global-layer config plus the
# combined provider config mechanism.
#
# Ships:
# - files/home/.config/opencode/opencode.jsonc — the permissive OpenCode
#   config (edit/bash/webfetch allowed; the sandbox is the isolation
#   boundary; sharing + websearch disabled). Lives in the global config
#   layer as opencode.jsonc; the sandbox-managed opencode.json (MCP
#   gateway wiring) is a separate file and both are merged by OpenCode.
#   Provider mixins layer on top via fragments (see below).
# - environment.variables.OPENCODE_CONFIG — points at the combined
#   provider config (~/.config/opencode/providers.jsonc). OWNED HERE:
#   every provider mixin (zeldoc, copilot, ...) ships a pure-JSON
#   fragment to ~/.config/opencode/providers.d/NN-<name>.json and the
#   merge below rebuilds that file at every start
#   (enabled_providers lists union; fragments never set the default
#   model — the project-level opencode config owns it). Never set
#   OPENCODE_CONFIG in another mixin or kit — this variable is the
#   single owner, which is what lets any number of provider mixins
#   compose.
# - files/home/.sandbox-kit/merge-global-opencode-config.sh — the provider
#   config fragment merger (jq; enabled_providers union, later fragments
#   win scalar conflicts; seeds a valid empty config when there are no
#   fragments).
# - files/home/.sandbox-kit/hooks.d/provider-config.sh — the hook the
#   base mixin's entrypoint runtime sources after the banner and
#   env-guard hooks (glob order): exports
#   OPENCODE_CONFIG defensively and runs the merge, so `o`/`opencode`
#   relaunched from the login shell keep working even if a runtime
#   skipped mixin env injection.
#
# Required when composing a model provider (zeldoc, copilot): their
# fragments only merge through this mixin. Pairs with mixins/base
# (entrypoint runtime + agent guidance + MCP gateway); mixins/env-guard
# adds the .env guard and mixins/banner the startup banner. No network
# rules: capability egress comes from the other mixins.
schemaVersion: "2"
kind: mixin
name: global-opencode-config
displayName: Global OpenCode config
description: >
  The permissive OpenCode config (edit/bash/webfetch allowed — the sandbox
  is the isolation boundary; sharing + websearch disabled), dropped into
  the global config layer as opencode.jsonc, plus the combined provider
  config: OPENCODE_CONFIG points at ~/.config/opencode/providers.jsonc,
  rebuilt at every start from the provider mixins' fragments in
  providers.d/ by merge-global-opencode-config.sh (sourced via the entrypoint's
  hook runner). Merged with the sandbox-managed opencode.json (MCP gateway
  wiring) and any project config layer. No network rules — capability
  egress comes from the other mixins.
version: 0.3.0

environment:
  variables:
    # The combined OpenCode provider config, rebuilt at every start from
    # ~/.config/opencode/providers.d/*.json by
    # ~/.sandbox-kit/merge-global-opencode-config.sh (called by this mixin's
    # provider-config hook, which also re-exports this var defensively).
    # Merges between the global and project config layers, so sandbox
    # wiring in the managed opencode.json is preserved and the project
    # opencode.jsonc owns the default model. Owned here —
    # provider mixins/kits must not set OPENCODE_CONFIG.
    OPENCODE_CONFIG: /home/agent/.config/opencode/providers.jsonc

# Files dropped into the sandbox home (see the header for the layout):
# .config/opencode/opencode.jsonc, .sandbox-kit/merge-global-opencode-config.sh,
# .sandbox-kit/hooks.d/provider-config.sh.
