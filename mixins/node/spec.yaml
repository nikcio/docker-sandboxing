schemaVersion: "2"
kind: mixin
name: node
displayName: Node.js / NVM / PNPM
description: >
  Adds Node.js with nvm and PNPM.
version: 0.4.0

args:
  nodeVersion:
    default: ""
    description: Node.js version to install (empty = latest)
    pattern: '^$|^(node/)?v?[0-9]+(\.[0-9]+)*$'
  pnpmVersion:
    default: ""
    description: PNPM version to install (empty = latest)
    pattern: '^$|^[0-9]+(\.[0-9]+)*$'
  nvmVersion:
    default: ""
    description: NVM version to clone (empty = latest release)
    pattern: '^$|^v[0-9]+\.[0-9]+\.[0-9]+$'

setup:
  install:
    - command: >
        set -e;
        if command -v node >/dev/null 2>&1 && command -v pnpm >/dev/null 2>&1; then exit 0; fi;
        install -m 0755 -d /var/lib/apt/sbx-install-lists;
        export DEBIAN_FRONTEND=noninteractive;
        { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
        apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
        export NVM_DIR=/home/agent/.nvm;
        NVM_REF="${{ kit.args.nvmVersion }}";
        if [ -z "${NVM_REF}" ]; then
          NVM_REF="$(curl -fsSL https://api.github.com/repos/nvm-sh/nvm/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)";
        fi;
        git clone -q --depth 1 --branch "${NVM_REF}" https://github.com/nvm-sh/nvm.git "$NVM_DIR";
        unset NPM_CONFIG_PREFIX;
        . "$NVM_DIR/nvm.sh";
        NODE_SPEC="${{ kit.args.nodeVersion }}";
        if [ -z "${NODE_SPEC}" ]; then NODE_SPEC=node; fi;
        nvm install "${NODE_SPEC}";
        NODE_RESOLVED="$(nvm version "${NODE_SPEC}")";
        nvm alias default "${NODE_RESOLVED}";
        nvm use default;
        NODE_BIN="$(find "$NVM_DIR"/versions/node -mindepth 2 -maxdepth 2 -name bin -type d | sort -V | tail -n 1)";
        for b in node npm npx pnpm pnpx corepack; do if [ -e "$NODE_BIN/$b" ]; then ln -sf "$NODE_BIN/$b" "/usr/local/bin/$b"; fi; done;
        { echo 'export NVM_DIR=/home/agent/.nvm'; echo 'unset NPM_CONFIG_PREFIX'; echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'; } >> /etc/sandbox-persistent.sh;
        unset NPM_CONFIG_PREFIX;
        PNPM_SPEC="${{ kit.args.pnpmVersion }}";
        if [ -n "${PNPM_SPEC}" ]; then PNPM_SPEC="@${PNPM_SPEC}"; fi;
        npm install -g "pnpm${PNPM_SPEC}";
        PNPM_BIN="$(command -v pnpm)";
        if [ "$(dirname "$PNPM_BIN")" != "/usr/local/bin" ]; then ln -sf "$PNPM_BIN" /usr/local/bin/pnpm; fi;
        node --version;
        pnpm --version
      description: Ensure node (nvm) + pnpm are available (install when the base image lacks them)

environment:
  variables:
    PNPM_CONFIG_MINIMUM_RELEASE_AGE: "1440"

permissions:
  network:
    allow:
      # nvm install / nodejs.org distribution
      - nodejs.org:443
      - "*.nodejs.org:443"

      # nvm's io.js mirror (fetched by every `nvm ls-remote`; needed for
      # io.js listings and installs)
      - iojs.org:443

      # nvm itself (the check-and-install step clones the nvm repo from
      # GitHub when the base image lacks node — raw.githubusercontent
      # covers the install script variant)
      - github.com:443
      - "*.github.com:443"
      - raw.githubusercontent.com:443

      # npm registry (pnpm/npm/npx installs and fetches)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
      - npmjs.com:443
      - "*.npmjs.com:443"

      # pnpm.io: pnpm docs and settings reference for agent lookups —
      # pnpm's own errors point here (e.g. the minimumReleaseAge gate
      # above links pnpm.io/settings#minimumreleaseageexclude)
      - pnpm.io:443

      # Ubuntu apt mirrors: the install step calls apt-get when the base
      # image lacks the tool. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"
