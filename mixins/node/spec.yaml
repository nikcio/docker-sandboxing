# Node mixin: Node.js/NVM/PNPM egress and agent notes.
schemaVersion: "2"
kind: mixin
name: node
displayName: Node.js / NVM / PNPM
description: >
  Network rules for the Node.js toolchain: nodejs.org distribution servers
  for nvm installs and the npm registry for pnpm/npm/npx.
version: 0.1.0

permissions:
  network:
    allow:
      # nvm install / nodejs.org distribution
      - nodejs.org:443
      - "*.nodejs.org:443"
      # npm registry (pnpm/npm/npx installs and fetches)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
      - npmjs.com:443
      - "*.npmjs.com:443"

# Agent memory note: files/home/.sbx-agents.d/node.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
