# Omnium mixin: Omnium OMS/e-commerce platform egress so apps and the agent
# can call the Omnium REST API (orders, products, inventory, customers,
# carts, ...) and mint their own API tokens.
#
# Omnium auth is client-credentials: POST /api/token?clientId=...&client-
# Secret=... on an API host returns a 10-day JWT used as Authorization:
# Bearer. Apps in the sandbox perform that exchange themselves — the proxy
# keeps the ClientSecret out of the VM while they do it. Register the
# secret host-side as a custom secret (`sbx secret set-custom --host
# apitest.omnium.no --host api.omnium.no --host apidev.omnium.no --env
# OMNIUM_CLIENT_SECRET` — see docs/omnium-api-key.md): the sandbox sees
# only a generated placeholder in OMNIUM_CLIENT_SECRET, and the proxy
# swaps in the real value wherever the placeholder appears in a request
# to those hosts, including the /api/token query string. The ClientId is
# not a secret — the project's .sbxenv.yaml passes it as OMNIUM_CLIENT_ID.
#
# No kit-declared credential on purpose: a kit credential injects a fixed
# header value on matching hosts, which would clobber the Authorization
# bearer the app mints for itself, and kit credentials never deliver a
# secret as a readable env var.
schemaVersion: "2"
kind: mixin
name: omnium
displayName: Omnium (omnium.no)
description: >
  Omnium OMS/e-commerce platform egress: the REST API hosts (production,
  test, and dev — each serving its Swagger UI under /documentation) and
  the tech docs site. Omnium credentials are provisioned host-side (sbx
  custom secret); apps in the sandbox mint their own API tokens.
version: 0.1.0

permissions:
  network:
    allow:
      # REST API: production, test, and dev. The Swagger UI is served on
      # each host under /documentation.
      - api.omnium.no:443
      - apitest.omnium.no:443
      - apidev.omnium.no:443
      # Tech docs (docs.omnium.no), user docs, and system status —
      # reachable without credentials, for research.
      - docs.omnium.no:443
      - help.omnium.no:443
      - status.omnium.no:443

# Agent memory note: files/home/.sbx-agents.d/omnium.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
