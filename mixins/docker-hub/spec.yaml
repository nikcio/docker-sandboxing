schemaVersion: "2"
kind: mixin
name: docker-hub
displayName: Docker Hub
description: >
  Network rules so the in-sandbox Docker engine can pull base images and
  build containers.
version: 0.1.0

permissions:
  network:
    allow:
      # Docker Hub
      - docker.io
      - "*.docker.io"
      - "*.docker.com"
      - production.cloudflare.docker.com
      - production.cloudfront.docker.com