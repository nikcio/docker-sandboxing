schemaVersion: "2"
kind: mixin
name: opencode
displayName: OpenCode
description: >
  Installs OpenCode (npm) when the sandbox lacks it, adds the permissive
  opencode config, and merges configs from other mixins using fragments
  (enabled_*/disabled_* lists union).
version: 0.6.0

setup:
  install:
    - command: >
        set -e;
        if command -v opencode >/dev/null 2>&1; then exit 0; fi;
        if ! command -v npm >/dev/null 2>&1; then
          install -m 0755 -d /var/lib/apt/sbx-install-lists;
          export DEBIAN_FRONTEND=noninteractive;
          { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
          apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
          export NVM_DIR=/home/agent/.nvm;
          git clone -q --depth 1 --branch v0.40.7 https://github.com/nvm-sh/nvm.git "$NVM_DIR";
          unset NPM_CONFIG_PREFIX;
          . "$NVM_DIR/nvm.sh";
          nvm install 24;
          nvm alias default 24;
          nvm use default;
          NODE_BIN="$(find "$NVM_DIR"/versions/node -mindepth 2 -maxdepth 2 -name bin -type d | sort -V | tail -n 1)";
          for b in node npm npx; do if [ -e "$NODE_BIN/$b" ]; then ln -sf "$NODE_BIN/$b" "/usr/local/bin/$b"; fi; done;
          { echo 'export NVM_DIR=/home/agent/.nvm'; echo 'unset NPM_CONFIG_PREFIX'; echo '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'; } >> /etc/sandbox-persistent.sh;
        fi;
        unset NPM_CONFIG_PREFIX;
        npm install -g opencode-ai@latest;
        opencode --version
      description: Install OpenCode via npm (installs node via nvm first when npm is missing; skipped when opencode is already present)

  startup:
    - command:
        - bash
        - -c
        - |
          set -euo pipefail

          FRAG_DIR="${OPENCODE_MIXINS_DIR:-$HOME/.config/opencode/mixins.d}"
          OUT="${1:-$HOME/.config/opencode/sandbox-mixins.jsonc}"

          mkdir -p "$(dirname "$OUT")"

          seed() {
              # Nothing to merge: write the minimal valid config so OPENCODE_CONFIG
              # always points at a loadable file.
              printf '{\n  "$schema": "https://opencode.ai/config.json"\n}\n'
          }

          fail() {
              echo "ERROR [mixins-config]: $*" >&2
              exit 1
          }

          if [ ! -d "$FRAG_DIR" ]; then
              seed > "$OUT"
              echo "[mixins-config] no mixins fragments ($FRAG_DIR missing) — wrote the empty combined config"
              exit 0
          fi

          shopt -s nullglob
          fragments=("$FRAG_DIR"/*.json)
          jsonc=("$FRAG_DIR"/*.jsonc)
          shopt -u nullglob

          if [ "${#jsonc[@]}" -gt 0 ]; then
              fail "comment-bearing fragments are not supported: ${jsonc[*]} — mixins fragments in $FRAG_DIR must be comment-free .json (jq does the merging)"
          fi

          if [ "${#fragments[@]}" -eq 0 ]; then
              seed > "$OUT"
              echo "[mixins-config] no mixins fragments in $FRAG_DIR — wrote the empty combined config"
              exit 0
          fi

          tmp="$(mktemp "$(dirname "$OUT")/.sandbox-mixins.jsonc.XXXXXX")"
          tmp_wrapped="${tmp}.wrapped"
          trap 'rm -f "$tmp" "$tmp_wrapped"' EXIT

          if command -v jq > /dev/null 2>&1; then
              for f in "${fragments[@]}"; do
                  if ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
                      fail "$f is not a valid JSON object — fix or remove it (the previous combined config was left in place)"
                  fi
              done
              # Object values merge recursively; later fragments win scalar
              # conflicts (jq's `*`). Array-valued keys whose name starts
              # with "enabled_" or "disabled_" (e.g. enabled_mixins,
              # enabled_providers) are unioned instead — that is what lets
              # mixins compose (zeldoc + copilot both stay enabled).
              jq -s '
              def unionkey:
                  [keys[] | select(test("^enabled_|^disabled_"))] | .[];
              reduce .[] as $f (
                  {};
                  . as $acc
                  | (. * $f)
                  + (reduce ($f | unionkey) as $k ({};
                      .[$k] = ((($acc[$k] // []) + ($f[$k] // [])) | unique)))
              )
              ' "${fragments[@]}" > "$tmp"
          elif [ "${#fragments[@]}" -eq 1 ]; then
              # jq-less fallback: a single fragment needs no merging.
              cp -- "${fragments[0]}" "$tmp"
          else
              fail "jq is not available and there are ${#fragments[@]} fragments to merge — install jq (the base image ships it)"
          fi

          {
              printf '// GENERATED by the opencode mixin startup command — do not edit.\n'
              printf '// Fragments: %s\n' "$(basename -a "${fragments[@]}" | paste -sd' ' -)"
              printf '// Edit the owning mixin in docker-sandboxing (or a mixins.d/ fragment) and restart the sandbox.\n'
              cat "$tmp"
          } > "${tmp}.wrapped"
          mv -f "${tmp}.wrapped" "$OUT"

          echo "[mixins-config] merged ${#fragments[@]} mixins fragment(s) ($(basename -a "${fragments[@]}" | paste -sd' ' -)) -> $OUT"
      user: "agent"
      description: Merge mixins fragments into the combined OPENCODE_CONFIG

permissions:
  network:
    allow:
      # npm registry (opencode install + fragment consumers)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"

      # nvm install / nodejs.org distribution (only hit when npm is missing)
      - nodejs.org:443
      - "*.nodejs.org:443"
      - iojs.org:443

      # nvm itself (repo clone when the install step runs)
      - github.com:443
      - "*.github.com:443"
      - raw.githubusercontent.com:443

      # Ubuntu apt mirrors: the install step calls apt-get when npm is
      # missing. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"

environment:
  variables:
    # The generated config from this mixin
    OPENCODE_CONFIG: /home/agent/.config/opencode/sandbox-mixins.jsonc

    # C.UTF-8 is always present on glibc (no locale-gen needed); without
    # it man-db's profile script prints "manpath: can't set the locale"
    # on every shell start (the template images ship no locale env).
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
