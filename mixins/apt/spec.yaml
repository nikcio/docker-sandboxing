# apt mixin: OS package mirrors for `sudo apt-get` inside the sandbox,
# plus a background cache warm at sandbox start so the first
# `apt-get install` in a session isn't slow.
schemaVersion: "2"
kind: mixin
name: apt
displayName: OS packages (apt)
description: >
  Network rules for Ubuntu archives, the Microsoft package repo, PPAs,
  and Docker's apt repo (the base images ship its sources.list entry), so
  the agent can install OS packages inside the sandbox, plus a background
  apt-get update at sandbox start (no-op when apt-get is missing or these
  hosts are blocked — failures are swallowed by design).
version: 0.2.0

setup:
  startup:
    # Background cache warm: the first `apt-get install` in a session
    # shouldn't wait for a full index download. No-op when apt-get is
    # missing (non-Debian images) or the mirror hosts are blocked (this
    # mixin isn't composed) — failures are swallowed by design. The sbx
    # mixin's install step runs against a private lists dir to dodge the
    # lock race with this hook.
    - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true) &"]
      user: "root"
      description: Update apt package cache in background

permissions:
  network:
    allow:
      # Ubuntu archives (http/https)
      - archive.ubuntu.com
      - security.ubuntu.com
      # Microsoft package repo (dotnet, mssql, powershell via apt)
      - packages.microsoft.com:443
      # PPAs
      - "*.launchpadcontent.net:443"
      # Docker's apt repo: the Docker Sandboxes base images ship
      # /etc/apt/sources.list.d/docker.list (docker-ce + in-sandbox CLI
      # upgrades), and an unreachable repo makes EVERY `apt-get update`
      # exit 100 (playwright --with-deps runs `apt-get update && apt-get
      # install` and aborts on the failure). The sbx mixin allows the
      # same host for its own docker-sbx install.
      - download.docker.com:443
