schemaVersion: "2"
kind: mixin
name: uniform
displayName: Uniform (uniform.app)
description: >
  Adds Uniform API key injection and network rules for the Uniform dashboard, Management API, and Edge Delivery API.
version: 0.1.0

credentials:
  - service: uniform
    description: >
      Uniform API key (a service account key or personal access token) for
      the Management API and Edge Delivery API. Create it in Uniform under
      Security > Service Accounts.
    required: false
    apiKey:
      name: UNIFORM_API_KEY
      proxyManaged: true
      inject:
        - domain: uniform.app          # dashboard + Management API (US)
          header: x-api-key
          format: "%s"
        - domain: eu.uniform.app       # dashboard + Management API (EU)
          header: x-api-key
          format: "%s"
        - domain: uniform.global       # Edge Delivery API (US)
          header: x-api-key
          format: "%s"
        - domain: eu.uniform.global    # Edge Delivery API (EU)
          header: x-api-key
          format: "%s"

permissions:
  network:
    allow:
      # Dashboard, Management API, docs (docs.uniform.app), and per-team
      # app subdomains.
      - uniform.app:443
      - "*.uniform.app:443"
      
      # Edge Delivery API + image CDN, US and EU
      # (img.uniform.global / img.eu.uniform.global).
      - uniform.global:443
      - "*.uniform.global:443"
