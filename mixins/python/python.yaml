# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Python / uv
description: >
  Adds a uv-managed Python interpreter to the sandbox, with the uv tool for
  package and venv management, when the workload image lacks them.
version: "0.5.0"

args:
  python_version:
    default: "3.14"
    pattern: '^[0-9]+\.[0-9]+$'
    description: CPython version for uv to install (skipped when python3 + pip are already present)

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # uv installer (`curl -LsSf https://astral.sh/uv/install.sh | sh`) —
          # astral.sh 301-redirects the installer script to releases.astral.sh,
          # which is also the installer's primary artifact host (binaries fall
          # back to GitHub releases). Also used by the check-and-install step
          # on workloads without python.
          - astral.sh:443
          - releases.astral.sh:443
          - raw.githubusercontent.com:443

          # uv python install fetches CPython builds from astral-sh's
          # GitHub release assets (objects.githubusercontent.com serves
          # the actual download after the github.com redirect)
          - github.com:443
          - objects.githubusercontent.com:443

          # apt packages the installer needs
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80

      runtime:
        allow:
          # PyPI (uv/pip installs, index queries)
          - pypi.org:443
          - "*.pypi.org:443"

          # Package files served from the PyPI CDN
          - files.pythonhosted.org:443
          - "*.pythonhosted.org:443"

          # Python docs and release info for agent lookups (docs.python.org,
          # www.python.org/ftp, devguide.python.org lifecycles, peps.python.org)
          - python.org:443
          - "*.python.org:443"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: >
            set -e;
            if command -v python3 >/dev/null 2>&1 && python3 -m ensurepip --version >/dev/null 2>&1; then exit 0; fi;
            install -m 0755 -d /var/lib/apt/sbx-install-lists;
            export DEBIAN_FRONTEND=noninteractive;
            { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
            apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
            if [ ! -x /usr/local/bin/uv ]; then
              curl -LsSf https://astral.sh/uv/install.sh | env UV_UNMANAGED_INSTALL="/usr/local/bin" sh;
            fi;
            sudo -u agent env UV_PYTHON_INSTALL_DIR=/home/agent/.local/share/uv/python UV_LINK_MODE=copy uv python install "${{ kit.args.python_version }}";
            PY_BIN="$(find /home/agent/.local/share/uv/python -mindepth 2 -maxdepth 2 -name bin -type d -path '*cpython-*' | sort -V | tail -n 1)";
            ln -sf "$PY_BIN/python3" /usr/local/bin/python3;
            ln -sf "$PY_BIN/python3" /usr/local/bin/python;
            { echo 'export UV_PYTHON_INSTALL_DIR=/home/agent/.local/share/uv/python'; echo 'export UV_LINK_MODE=copy'; } >> /etc/sandbox-persistent.sh;
            python3 --version;
            apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends python3-venv >/dev/null 2>&1 || true
          description: Ensure python3 + uv are available (install when the workload image lacks them)

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./note.md
