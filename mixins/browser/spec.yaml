# Browser mixin: installs Google Chrome for the agent to drive.
#
# Software only — no network rules. The sandbox policy stays
# deny-by-default; the composed mixins own all egress.
#
# The creation-time download needs dl.google.com reachable through the
# proxy. If sandbox creation fails on it, check `sbx policy log` and compose
# a kit/mixin that allows the host.
schemaVersion: "2"
kind: mixin
name: browser
displayName: Browser (Google Chrome)
description: >
  Installs Google Chrome (stable) plus the color emoji font, and drops the
  agent memory note for driving it. Declares no network rules — browsing
  egress is owned by the composed mixins.
version: 0.1.0

setup:
  install:
    # The .deb is self-contained. The apt repo entry is removed after
    # install so the sandbox's background `apt-get update` never contacts
    # dl.google.com (not in any mixin's allowlist).
    - command: >
        curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        -o /tmp/google-chrome.deb
        && apt-get install -y /tmp/google-chrome.deb
        && rm -f /tmp/google-chrome.deb
        && apt-get install -y --no-install-recommends fonts-noto-color-emoji
        && rm -f /etc/apt/sources.list.d/google-chrome.list
        && rm -rf /var/lib/apt/lists/*

# Agent memory note: files/home/.sbx-agents.d/browser.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
