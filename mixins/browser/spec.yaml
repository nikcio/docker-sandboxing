# Browser mixin: Google Chrome for the agent to drive.
#
# Software only — this mixin deliberately declares NO network rules. The
# sandbox policy stays deny-by-default; whichever mixins are composed own
# the egress (the agent memory note says so). Chrome itself is self-
# contained: the .deb ships its dependencies, and its apt repo entry is
# removed after install (mirroring the template's gh pattern) so the
# sandbox's background `apt-get update` never contacts dl.google.com,
# which is in no mixin's allowlist.
#
# Note: the creation-time download below needs dl.google.com to be
# reachable through the proxy. If sandbox creation fails on it, check
# `sbx policy log` and compose a kit/mixin that allows the host.
schemaVersion: "2"
kind: mixin
name: browser
displayName: Browser (Google Chrome)
description: >
  Installs Google Chrome (stable) plus the color emoji font, and drops the
  agent memory note for driving it. Declares no network rules — browsing
  egress is owned by the composed mixins.
version: 0.1.0

setup:
  install:
    - command: >
        curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        -o /tmp/google-chrome.deb
        && apt-get install -y /tmp/google-chrome.deb
        && rm -f /tmp/google-chrome.deb
        && apt-get install -y --no-install-recommends fonts-noto-color-emoji
        && rm -f /etc/apt/sources.list.d/google-chrome.list
        && rm -rf /var/lib/apt/lists/*

# Agent memory: files/home/.sbx-agents.d/browser.md — the base kit's entrypoint
# appends it directly to the sandbox AGENTS.md (agentInstructions would only
# add a Kits-index side file after the runtime baseline).
