schemaVersion: "2"
kind: mixin
name: browser
displayName: Browser (Google Chrome)
description: >
  Installs Google Chrome (stable) plus the color emoji font
version: 0.2.1

setup:
  install:
    - command: >
        if command -v google-chrome >/dev/null 2>&1; then exit 0; fi
        && install -m 0755 -d /var/lib/apt/sbx-lists
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq || true
        && curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        -o /tmp/google-chrome.deb
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y /tmp/google-chrome.deb
        && rm -f /tmp/google-chrome.deb
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y --no-install-recommends fonts-noto-color-emoji
        && rm -rf /var/lib/apt/sbx-lists
        && rm -f /etc/apt/sources.list.d/google-chrome.list
      description: Install Google Chrome (skipped when the template image already has it)

permissions:
  network:
    allow:
      - dl.google.com:443
