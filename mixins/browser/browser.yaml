# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Browser (Google Chrome)
description: >
  Installs Google Chrome (stable) plus the color emoji font.
version: "0.4.0"

args:
  channel:
    default: "stable"
    enum: [stable, beta, unstable]
    description: Google Chrome release channel to install

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # Chrome .deb download
          - dl.google.com:443

          # apt (fonts-noto-color-emoji install; the .deb install itself)
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: >
            if command -v google-chrome >/dev/null 2>&1; then exit 0; fi
            && install -m 0755 -d /var/lib/apt/sbx-lists
            && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq || true
            && curl -fsSL https://dl.google.com/linux/direct/google-chrome-${{ kit.args.channel }}_current_amd64.deb
            -o /tmp/google-chrome.deb
            && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y /tmp/google-chrome.deb
            && rm -f /tmp/google-chrome.deb
            && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y --no-install-recommends fonts-noto-color-emoji
            && rm -rf /var/lib/apt/sbx-lists
            && rm -f /etc/apt/sources.list.d/google-chrome.list
          description: Install Google Chrome (skipped when the workload image already has it)

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./note.md
