# Playwright mixin (level 2 of 3): Playwright + full Chromium.
#
# Same as ../playwright/ but with the full Chromium build (headed-capable
# APIs, devtools protocol — still headless here: no display server). For
# Firefox + WebKit too use ../playwright-all/.
# Needs the apt mixin for the OS libraries (--with-deps).
#
# Browser binaries land in /home/agent/.cache/ms-playwright (the agent
# user's default lookup path; installed as root, then chowned).
schemaVersion: "2"
kind: mixin
name: playwright-chromium
displayName: Playwright (full Chromium)
description: >
  Playwright installed globally via npm with the full Chromium build
  preinstalled. Needs the apt mixin for the OS libraries (--with-deps).
version: 0.1.0

setup:
  install:
    # unset NPM_CONFIG_PREFIX: the template sets it for its own npm-global
    # dir, and nvm-managed npm refuses to run while it is set.
    - command: >
        unset NPM_CONFIG_PREFIX
        && npm install -g playwright
        && PLAYWRIGHT_BROWSERS_PATH=/home/agent/.cache/ms-playwright npx playwright install --with-deps chromium
        && chown -R agent:agent /home/agent/.cache/ms-playwright

permissions:
  network:
    allow:
      # npm package install (also covered by the node mixin — rules union)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
      # Playwright browser downloads (current CDN + legacy azureedge)
      - cdn.playwright.dev:443
      - "*.cdn.playwright.dev:443"
      - playwright.azureedge.net:443

# Agent memory note: files/home/.sbx-agents.d/playwright-chromium.md
# (appended to the sandbox AGENTS.md by the kit entrypoint).
