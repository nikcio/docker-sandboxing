# Git mixin: git hosting egress + the required worktree workflow.
schemaVersion: "2"
kind: mixin
name: git
displayName: Git hosting + worktree workflow
description: >
  Network rules for git hosting providers (HTTPS and SSH) and the base
  agent memory that mandates the git-worktree workflow.
version: 0.1.0

permissions:
  network:
    # Bare hostnames (no port) so git over SSH (22) works too.
    allow:
      - github.com
      - "*.github.com"
      - "*.githubusercontent.com"
      - gitlab.com
      - "*.gitlab.com"

# Agent memory: files/home/.sbx-agents.d/git.md — the base kit's entrypoint
# appends it directly to the sandbox AGENTS.md (agentInstructions would only
# add a Kits-index side file after the runtime baseline).
