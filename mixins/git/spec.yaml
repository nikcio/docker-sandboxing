# Git mixin: git hosting egress, proxy-managed GitHub auth, and the
# worktree workflow.
#
# Provision the token per sandbox with sbx's own prompt (fine-grained PATs
# only — never the broad-scope host `gh` token):
#   sbx secret set github --sandbox <sandbox-name>
# See docs/github-pat.md.
schemaVersion: "2"
kind: mixin
name: git
displayName: Git hosting + worktree workflow
description: >
  Network rules for git hosting providers (HTTPS and SSH), proxy-managed
  GitHub authentication for the gh CLI and git over HTTPS, and the base
  agent memory that mandates the git-worktree workflow.
version: 0.2.0

credentials:
  # Proxy-managed: the sandbox only ever sees the GH_TOKEN=proxy-managed
  # placeholder; the host-side proxy swaps in the real value on the hosts
  # below. Optional — without a stored token, public repos and git over SSH
  # still work (SSH agent forwarding). The inject domains must stay inside
  # permissions.network.allow.
  - service: github
    description: >
      GitHub personal access token for the gh CLI and git over HTTPS.
      Use a fine-grained PAT scoped to only the repositories and
      permissions the agent needs.
    required: false
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com          # gh REST/GraphQL API
          header: Authorization
          format: Bearer %s
        - domain: github.com              # git over HTTPS (proxy re-encodes to Basic)
          header: Authorization
          format: Bearer %s
        - domain: uploads.github.com      # `gh release upload`
          header: Authorization
          format: Bearer %s
        - domain: raw.githubusercontent.com
          header: Authorization
          format: Bearer %s

permissions:
  network:
    # Bare hostnames (no port) so git over SSH (22) works too.
    allow:
      - github.com
      - "*.github.com"
      - "*.githubusercontent.com"
      - gitlab.com
      - "*.gitlab.com"

# Agent memory note: files/home/.sbx-agents.d/git.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
