schemaVersion: "2"
kind: mixin
name: go
displayName: Go / Go modules
description: >
  Add Go toolchain support.
version: 0.5.0

args:
  goVersion:
    default: ""
    description: Go version to install (empty = latest)
    pattern: '^$|^go[0-9]+(\.[0-9]+)*$'

setup:
  install:
    - command: >
        set -e;
        install -m 0755 -d /var/lib/apt/sbx-install-lists;
        export DEBIAN_FRONTEND=noninteractive;
        { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
        apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
        GO_VERSION="${{ kit.args.goVersion }}";
        if [ -z "${GO_VERSION}" ]; then
          GO_VERSION="$(curl -fsSL 'https://go.dev/VERSION?m=text' | head -n 1)";
        fi;
        GO_CURRENT="$(go version 2>/dev/null | awk '{print $3}' || true)";
        if [ "${GO_CURRENT}" = "${GO_VERSION}" ]; then exit 0; fi;
        curl -fsSL "https://go.dev/dl/${GO_VERSION}.linux-$(dpkg --print-architecture).tar.gz" -o /tmp/sbx-go.tgz;
        rm -rf /usr/local/go;
        tar -C /usr/local -xzf /tmp/sbx-go.tgz;
        rm -f /tmp/sbx-go.tgz;
        ln -sf /usr/local/go/bin/go /usr/local/bin/go;
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt;
        hash -r;
        echo 'export PATH=$PATH:/home/agent/go/bin' >> /etc/sandbox-persistent.sh;
        go version
      description: Ensure the latest Go toolchain is available (upgrades distro Go to the latest upstream release)

permissions:
  network:
    allow:
      # Module proxy (`go get`, `go mod download`, `go install`) — also
      # serves GOTOOLCHAIN=auto toolchain downloads (golang.org/toolchain
      # modules)
      - proxy.golang.org:443
      # Checksum database (default GOSUMDB) — verifies every module and
      # toolchain download
      - sum.golang.org:443
      # go.dev: docs lookups, /dl/ download redirects, release info
      - go.dev:443
      - "*.go.dev:443"
      # golang.org (redirects to go.dev; x/ module paths resolve via the
      # proxy)
      - golang.org:443
      - "*.golang.org:443"
      # dl.google.com: go.dev/dl download targets (e.g. golang.org/dl
      # wrapper SDK downloads: `go install golang.org/dl/go1.x@latest`
      # then `go1.x download`)
      - dl.google.com:443

      # Ubuntu apt mirrors: the install step calls apt-get when the
      # base image lacks the tool. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"
