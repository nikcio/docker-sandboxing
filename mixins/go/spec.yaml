# Go mixin: Go module proxy + checksum database egress, agent notes, and
# the check-and-install step so the mixin composes on any base template
# image (installs Go from go.dev/dl only when the template lacks it).
schemaVersion: "2"
kind: mixin
name: go
displayName: Go / Go modules
description: >
  Network rules for the Go toolchain: the module proxy (go get, go mod
  download, go install) and the checksum database that verifies every
  download. The proxy also serves toolchain modules, so GOTOOLCHAIN=auto
  (the default) can fetch a newer Go than the one baked into the image
  without root or a rebuild. dl.google.com covers go.dev/dl artifact
  downloads (golang.org/dl wrapper installs, and the check-and-install
  step on templates without Go), and the go.dev/golang.org sites serve
  the language docs and release info for agent lookups. Composes on any
  base template image: a setup.install step installs the official Go
  tarball only when the template doesn't already have go.
version: 0.3.0

setup:
  install:
    # Check-and-install: a no-op on template-go (and any image with go on
    # PATH); on other base images it installs the official tarball (same
    # /usr/local/go layout as template-go). Needs this mixin's go.dev
    # egress plus the apt mixin for the OS packages on bare bases. The
    # update+install run against a private lists dir: install steps race
    # the apt mixin's background `apt-get update` startup hook for
    # /var/lib/apt/lists/lock (apt-get update has no lock-wait option); a
    # private dir needs only the dpkg + archives locks, and a failing
    # repo in the image's sources (e.g. the base image's docker.list)
    # only exits 100 without losing the fetched lists.
    # /etc/sandbox-persistent.sh is sourced before every bash command and
    # in login shells.
    - command: >
        set -e;
        if command -v go >/dev/null 2>&1; then exit 0; fi;
        install -m 0755 -d /var/lib/apt/sbx-install-lists;
        export DEBIAN_FRONTEND=noninteractive;
        { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
        apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
        curl -fsSL "https://go.dev/dl/go1.25.5.linux-$(dpkg --print-architecture).tar.gz" -o /tmp/sbx-go.tgz;
        rm -rf /usr/local/go;
        tar -C /usr/local -xzf /tmp/sbx-go.tgz;
        rm -f /tmp/sbx-go.tgz;
        ln -sf /usr/local/go/bin/go /usr/local/bin/go;
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt;
        echo 'export PATH=$PATH:/home/agent/go/bin' >> /etc/sandbox-persistent.sh;
        go version
      description: Ensure the Go toolchain is available (install when the template image lacks it)

permissions:
  network:
    allow:
      # Module proxy (`go get`, `go mod download`, `go install`) — also
      # serves GOTOOLCHAIN=auto toolchain downloads (golang.org/toolchain
      # modules)
      - proxy.golang.org:443
      # Checksum database (default GOSUMDB) — verifies every module and
      # toolchain download
      - sum.golang.org:443
      # go.dev: docs lookups, /dl/ download redirects, release info
      - go.dev:443
      - "*.go.dev:443"
      # golang.org (redirects to go.dev; x/ module paths resolve via the
      # proxy)
      - golang.org:443
      - "*.golang.org:443"
      # dl.google.com: go.dev/dl download targets (e.g. golang.org/dl
      # wrapper SDK downloads: `go install golang.org/dl/go1.x@latest`
      # then `go1.x download`)
      - dl.google.com:443

# Agent memory note: files/home/.sbx-agents.d/go.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
