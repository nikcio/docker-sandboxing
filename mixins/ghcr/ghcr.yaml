# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: GitHub Container Registry
description: >
  Network rules so the in-sandbox Docker engine can pull base images and
  build containers.
version: "0.1.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # GitHub Container Registry
          - ghcr.io:443
          - "*.ghcr.io:443"
