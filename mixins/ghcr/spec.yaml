schemaVersion: "2"
kind: mixin
name: ghcr
displayName: GitHub Container Registry
description: >
  Network rules so the in-sandbox Docker engine can pull base images and
  build containers.
version: 0.1.0

permissions:
  network:
    allow:
      # GitHub Container Registry
      - ghcr.io:443
      - "*.ghcr.io:443"
