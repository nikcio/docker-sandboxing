schemaVersion: "2"
kind: mixin
name: herdr
displayName: Herdr
description: >
  Installs the Herdr CLI (agent runtime, keeps coding agents running and
  resume them from any machine) for the agent user.
version: 0.2.0

args:
  herdrVersion:
    default: ""
    description: Herdr version to install (empty = latest)
    pattern: '^$|^v?[0-9]+(\.[0-9]+)*$'

setup:
  install:
    - command: >
        set -e;
        if command -v herdr >/dev/null 2>&1; then exit 0; fi;
        install -m 0755 -d /var/lib/apt/sbx-install-lists;
        export DEBIAN_FRONTEND=noninteractive;
        { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
        apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl;
        rm -rf /var/lib/apt/sbx-install-lists;
        HERDR_VERSION="${{ kit.args.herdrVersion }}";
        case "${HERDR_VERSION}" in v*) HERDR_VERSION="${HERDR_VERSION#v}";; esac;
        if [ -n "${HERDR_VERSION}" ]; then
          case "$(uname -m)" in
            x86_64|amd64) HERDR_ARCH=x86_64 ;;
            aarch64|arm64) HERDR_ARCH=aarch64 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac;
          curl -fsSL "https://github.com/herdrdev/herdr/releases/download/v${HERDR_VERSION}/herdr-linux-${HERDR_ARCH}" -o /usr/local/bin/herdr;
          chmod +x /usr/local/bin/herdr;
        else
          curl -fsSL https://herdr.dev/install.sh | HERDR_INSTALL_DIR=/usr/local/bin sh;
        fi;
        herdr --version
      description: Install the herdr CLI (skipped when the base image already has it)

permissions:
  network:
    allow:
      # Installer + release manifest (herdr.dev/install.sh, latest.json).
      - herdr.dev:443

      # Release binaries downloaded from GitHub releases by the installer
      # and by `herdr update`.
      - github.com:443
      - "*.github.com:443"
      - objects.githubusercontent.com:443

      # Ubuntu apt mirrors: the install step calls apt-get when the
      # base image lacks the tool. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"
