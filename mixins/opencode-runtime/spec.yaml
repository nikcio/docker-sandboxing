# OpenCode runtime mixin: egress the agent itself needs (updates, model
# metadata, Zen auth, npm-hosted plugins).
schemaVersion: "2"
kind: mixin
name: opencode-runtime
displayName: OpenCode runtime
description: >
  Network rules for the OpenCode agent runtime: updates, model lists
  (models.dev), Zen console auth, and npm-hosted plugins.
version: 0.1.0

permissions:
  network:
    allow:
      - opencode.ai:443
      - "*.opencode.ai:443"
      - models.dev:443
      - console.anomaly.co:443
      - "*.anomaly.co:443"
      # Plugins and npm-hosted tooling installed by the agent. The node
      # mixin allows the same registry for package managers; rules union.
      - registry.npmjs.org:443
      - "*.npmjs.org:443"

agentInstructions:
  content: |
    ## OpenCode runtime

    - Agent updates, model metadata (models.dev), and Zen auth are allow-listed.
    - OpenCode plugins install from the npm registry; sharing is disabled and
      the default `opencode` provider is turned off when the zeldoc mixin is
      composed.
