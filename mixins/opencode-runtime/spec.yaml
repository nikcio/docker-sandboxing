# OpenCode runtime mixin: egress the agent itself needs (updates, model
# metadata, npm-hosted plugins).
schemaVersion: "2"
kind: mixin
name: opencode-runtime
displayName: OpenCode runtime
description: >
  Network rules for the OpenCode agent runtime: updates, model lists
  (models.dev), and npm-hosted plugins.
version: 0.1.1

permissions:
  network:
    allow:
      - opencode.ai:443
      - "*.opencode.ai:443"
      - models.dev:443
      # npm registry (plugins; also covered by the node mixin — rules union)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
