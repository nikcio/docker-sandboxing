# OpenCode runtime mixin: egress the agent itself needs (the opencode.ai
# hosts and model metadata). npm-registry egress (updates, npm-hosted
# plugins) lives in the opencode-update mixin.
schemaVersion: "2"
kind: mixin
name: opencode-runtime
displayName: OpenCode runtime
description: >
  Network rules for the OpenCode agent runtime: the opencode.ai hosts and
  model lists (models.dev). The npm registry (opencode updates +
  npm-hosted plugins) is the opencode-update mixin's rule — compose that
  for updates and plugin installs.
version: 0.1.2

permissions:
  network:
    allow:
      - opencode.ai:443
      - "*.opencode.ai:443"
      - models.dev:443
