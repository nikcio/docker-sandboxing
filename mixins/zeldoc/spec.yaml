# Zeldoc.ai mixin: wires the zdev model provider into OpenCode.
#
# - Proxy-managed API key (the real key never enters the VM); provision
#   host-side with `sbx secret set zeldoc` — see docs/zeldoc-api-key.md
# - Provider config shipped as a pure-JSON fragment to
#   ~/.config/opencode/providers.d/20-zeldoc.json. Requires the
#   global-opencode-config mixin: it merges all provider fragments into
#   the combined OPENCODE_CONFIG file at every start (enabled_providers
#   lists are unioned, so this mixin composes with the copilot mixin and
#   any future provider mixin). Never set OPENCODE_CONFIG in a mixin —
#   the global-opencode-config mixin owns it.
# - Fragment notes: files sort in filename order and later files win
#   scalar conflicts. Fragments do not set the default model — the
#   project-level opencode config owns it (a `model` key in the repo's
#   opencode.jsonc; opencode falls back to its own default when unset).
#   The model's context limit lives in `"limit".context` (currently
#   1000000, per the Zeldoc connect guide). Fragments must stay
#   comment-free JSON: the merge runs through jq.
schemaVersion: "2"
kind: mixin
name: zeldoc
displayName: Zeldoc.ai provider
description: >
  Zeldoc.ai (zdev) model provider for OpenCode: proxy-managed API key,
  provider config fragment, and network rules for the Zeldoc hosts.
version: 0.3.0

credentials:
  - service: zeldoc
    description: Zeldoc.ai API key for AI model access.
    required: true
    apiKey:
      name: ZELDOC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.zeldoc.ai
          header: Authorization
          format: Basic %s

permissions:
  network:
    allow:
      # Model API (auth injected by the proxy) + docs for webfetch.
      - api.zeldoc.ai:443
      - zeldoc.ai:443
      - docs.zeldoc.ai:443
