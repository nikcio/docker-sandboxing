# Zeldoc.ai mixin: wires the zdev model provider into OpenCode.
#
# - Proxy-managed API key (the real key never enters the VM); provision
#   host-side with `sbx secret set zeldoc` — see docs/zeldoc-api-key.md
# - Provider config injected via OPENCODE_CONFIG (merged with the
#   sandbox-managed ~/.config/opencode/opencode.json)
schemaVersion: "2"
kind: mixin
name: zeldoc
displayName: Zeldoc.ai provider
description: >
  Zeldoc.ai (zdev) model provider for OpenCode: proxy-managed API key,
  provider config file, and network rules for the Zeldoc hosts.
version: 0.1.0

environment:
  variables:
    # Merges between the global and project config layers, so sandbox
    # wiring in the managed opencode.json is preserved.
    OPENCODE_CONFIG: /home/agent/.config/opencode/zeldoc.jsonc

credentials:
  - service: zeldoc
    description: Zeldoc.ai API key for AI model access.
    required: true
    apiKey:
      name: ZELDOC_API_KEY
      proxyManaged: true
      inject:
        - domain: api.zeldoc.ai
          header: Authorization
          format: Basic %s

permissions:
  network:
    allow:
      # Model API (auth injected by the proxy) + docs for webfetch.
      - api.zeldoc.ai:443
      - zeldoc.ai:443
      - docs.zeldoc.ai:443
