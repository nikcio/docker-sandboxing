schemaVersion: "2"
kind: mixin
name: zsh
displayName: Zsh + Oh My Zsh
description: >
  Installs zsh with Oh My Zsh for the agent user and makes it the login shell.
version: 0.2.0

args:
  zshVersion:
    default: ""
    description: zsh apt package version to install (empty = latest apt candidate)
    pattern: '^$|^[0-9][0-9A-Za-z.+~:-]*$'
  ohMyZshRef:
    default: ""
    description: Oh My Zsh git ref to clone (empty = master HEAD)
    pattern: '^$|^[A-Za-z0-9._/-]+$'

setup:
  install:
    - command: >
        if [ -x /usr/bin/zsh ] && [ -d /home/agent/.oh-my-zsh ]; then exit 0; fi
        && export DEBIAN_FRONTEND=noninteractive
        && install -m 0755 -d /var/lib/apt/sbx-lists
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists update -qq || true
        && ZSH_PKG="zsh"
        && ZSH_SPEC="${{ kit.args.zshVersion }}"
        && if [ -n "${ZSH_SPEC}" ]; then ZSH_PKG="zsh=${ZSH_SPEC}"; fi
        && apt-get -o Dir::State::lists=/var/lib/apt/sbx-lists install -y -qq --no-install-recommends ${ZSH_PKG} git curl ca-certificates
        && rm -rf /var/lib/apt/sbx-lists
        && OMZ_REF="${{ kit.args.ohMyZshRef }}"
        && git clone -q --depth 1 ${OMZ_REF:+--branch "${OMZ_REF}"} https://github.com/ohmyzsh/ohmyzsh.git /home/agent/.oh-my-zsh
        && chown -R agent:agent /home/agent/.oh-my-zsh
        && cp -n /home/agent/.oh-my-zsh/templates/zshrc.zsh-template /home/agent/.zshrc
        && chown agent:agent /home/agent/.zshrc
        && if [ "$(getent passwd agent | cut -d: -f7)" != "/usr/bin/zsh" ]; then chsh -s /usr/bin/zsh agent; fi
        && zsh --version
      description: Install zsh + Oh My Zsh for the agent user (skipped when already present)

permissions:
  network:
    allow:
      # Oh My Zsh repo (install/update)
      - github.com:443
      - "*.github.com:443"
      - raw.githubusercontent.com:443
      # ohmyz.sh: docs and wiki referenced by the framework itself
      - ohmyz.sh:443

      # Ubuntu apt mirrors: the install step calls apt-get when the
      # base image lacks the tool. ports.ubuntu.com carries arm64 packages.
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com

      # Certificate revocation (OCSP/CRL) + timestamp endpoints for the
      # common public CAs. Hit by curl/git/node when they do HTTPS
      # revocation checks during the install.
      - "*.digicert.com"
      - "*.symcd.com"
      - "*.symcb.com"
      - "*.ws.symantec.com"
      - "*.sectigo.com"
      - "*.usertrust.com"
      - "*.globalsign.com"
