# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: .NET / NuGet
description: >
  Ensures the .NET SDK is available when the workload image lacks it, and
  keeps NuGet and the Microsoft download hosts reachable.
version: "0.6.0"

args:
  channel:
    default: "10.0"
    pattern: '^[0-9]+\.[0-9]+$'
    description: .NET release channel for the SDK install (apt feed or dot.net script)

# Literal provide: the version must resolve at publish (the channel arg
# is create-phase and stays a reference in the published descriptor).
# Bump alongside the default channel; a channel override does not change
# what this mixin vouches for.
provides:
  - dotnet@10.0

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # .NET SDK apt package (dotnet-sdk-10.0) or dotnet-install script +
          # SDK/ASP.NET certificate prerequisites
          - "*.microsoft.com:443"
          - dot.net:443
          - "*.dot.net:443"
          - aka.ms:443

          # apt packages the installer needs
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80

      runtime:
        allow:
          # NuGet (restore, push, search)
          - nuget.org:443
          - "*.nuget.org:443"

          # SDK/workload downloads, MS Build hosts, packages.microsoft.com
          - "*.microsoft.com:443"

          # SDK download CDN — dot.net's install script redirects SDK/workload
          # downloads here (builds.dotnet.microsoft.com; the single-label rule
          # above doesn't match the sub-subdomain)
          - "*.dotnet.microsoft.com:443"

          # dotnet-install script + feeds
          - dot.net:443
          - "*.dot.net:443"

          # Microsoft's short-link redirect service — dotnet-install.sh resolves
          # its primary SDK/workload download URL by following aka.ms/dotnet/...
          # short links (it silently falls back to the CDNs above when blocked)
          - aka.ms:443

          # Legacy download CDNs
          - "*.azureedge.net:443"

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: >
            set -e;
            if command -v dotnet >/dev/null 2>&1; then exit 0; fi;
            install -m 0755 -d /var/lib/apt/sbx-install-lists;
            export DEBIAN_FRONTEND=noninteractive;
            { apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists update -qq || true; };
            apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends ca-certificates curl xz-utils;
            if apt-get -o Dir::State::lists=/var/lib/apt/sbx-install-lists install -y -qq --no-install-recommends dotnet-sdk-${{ kit.args.channel }} 2>/dev/null; then
              { echo 'export DOTNET_CLI_TELEMETRY_OPTOUT=1'; echo 'export DOTNET_NOLOGO=1'; echo 'export DOTNET_GENERATE_ASPNET_CERTIFICATE=false'; echo 'export NUGET_XMLDOC_MODE=skip'; } >> /etc/sandbox-persistent.sh;
            else
              DOTNET_ROOT=/usr/share/dotnet sh -c '
                set -e
                curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/sbx-dotnet-install.sh
                chmod +x /tmp/sbx-dotnet-install.sh
                /tmp/sbx-dotnet-install.sh --channel "${{ kit.args.channel }}" --install-dir "$DOTNET_ROOT"
                rm -f /tmp/sbx-dotnet-install.sh
                ln -sf "$DOTNET_ROOT/dotnet" /usr/local/bin/dotnet
                mkdir -p "$DOTNET_ROOT/tools"';
              { echo 'export DOTNET_ROOT=/usr/share/dotnet'; echo 'export PATH=$PATH:/usr/share/dotnet/tools'; echo 'export DOTNET_CLI_TELEMETRY_OPTOUT=1'; echo 'export DOTNET_NOLOGO=1'; echo 'export NUGET_XMLDOC_MODE=skip'; } >> /etc/sandbox-persistent.sh;
            fi;
            dotnet --version
          description: Ensure the .NET SDK is available (install when the workload image lacks it)
