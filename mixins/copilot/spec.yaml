schemaVersion: "2"
kind: mixin
name: copilot
displayName: GitHub Copilot provider
description: >
  GitHub Copilot model provider for OpenCode.
version: 0.2.0

permissions:
  network:
    allow:
      # OAuth device flow: device code, access token exchange, and token
      # refresh (github.com/login/oauth/*).
      - github.com:443
      
      # Copilot session token mint (api.github.com/copilot_internal).
      - api.github.com:443
      
      # Copilot API: models list + inference. The wildcard covers the
      # business/enterprise plan endpoints (api.business./api.enterprise.
      # githubcopilot.com).
      - api.githubcopilot.com:443
      - "*.githubcopilot.com:443"
