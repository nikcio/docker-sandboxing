# Playwright mixin (level 1 of 3): Playwright + Chromium headless shell.
#
# Lightest browser-automation setup (headless-only usage). For full Chromium
# use ../playwright-chromium/, for Firefox + WebKit too use ../playwright-all/.
# Needs the apt mixin for the OS libraries (--with-deps).
#
# Browser binaries land in /home/agent/.cache/ms-playwright (the agent
# user's default lookup path; installed as root, then chowned).
schemaVersion: "2"
kind: mixin
name: playwright
displayName: Playwright (Chromium headless shell)
description: >
  Playwright installed globally via npm with the Chromium headless shell
  preinstalled — headless-only automation, the smallest download. Needs
  the apt mixin for the OS libraries (--with-deps).
version: 0.1.0

setup:
  install:
    # unset NPM_CONFIG_PREFIX: the template sets it for its own npm-global
    # dir, and nvm-managed npm refuses to run while it is set.
    - command: >
        unset NPM_CONFIG_PREFIX
        && npm install -g playwright
        && PLAYWRIGHT_BROWSERS_PATH=/home/agent/.cache/ms-playwright npx playwright install --with-deps chromium-headless-shell
        && chown -R agent:agent /home/agent/.cache/ms-playwright

permissions:
  network:
    allow:
      # npm package install (also covered by the node mixin — rules union)
      - registry.npmjs.org:443
      - "*.npmjs.org:443"
      # Playwright browser downloads (current CDN + legacy azureedge; both
      # redirect to the prss.microsoft.com CDN that serves the binaries)
      - cdn.playwright.dev:443
      - "*.cdn.playwright.dev:443"
      - playwright.azureedge.net:443
      - playwright.download.prss.microsoft.com:443

# Agent memory note: files/home/.sbx-agents.d/playwright.md (appended to the
# sandbox AGENTS.md by the kit entrypoint).
