# OpenCode agent baseline: the kit entrypoint runtime, the AGENTS.md
# logic, and the MCP gateway, as one mixin. Every sandbox built from a
# kit-<stack>/ spec composes this mixin — the kit entrypoints exec the
# runtime script shipped here and refuse to start without it (a clear
# error drops you into a login shell).
#
# Ships:
# - files/home/.sandbox-kit/entrypoint.sh — the entrypoint runtime: mixin
#   hook runner (~/.sandbox-kit/hooks.d/*.sh), opencode autostart, login
#   shell on exit. The hooks come from the composed mixins: this mixin's
#   two below, the env-guard mixin's .env guard, the banner mixin's
#   startup banner, and the global-opencode-config mixin's provider
#   config merge.
# - files/home/.sandbox-agents.md — the shared AGENTS.md base (stack facts
#   come from the stack mixins' .sbx-agents.d/ notes).
# - files/home/.sandbox-agents/*.md — the guidance files the base links to
#   (persistent shell env, network access, git auth, workspace mode).
# - files/home/.sandbox-kit/hooks.d/agents-md.sh — the AGENTS.md rebuild
#   (base content + every composed mixin's .sbx-agents.d/ note + the
#   runtime's Kits index), sourced by the entrypoint runtime before
#   opencode starts.
# - files/home/.sandbox-kit/hooks.d/mcp-gateway.sh — the idempotent MCP
#   gateway backstop (sourced by the entrypoint runtime; writes the
#   gateway config only when the startup hook below didn't run).
# - files/home/.sandbox-kit/lib/install-toolchain.sh — the check-and-
#   install helpers other mixins source in their setup.install steps, so
#   any mixin composes on any base template image (installs the
#   toolchain only when the template doesn't already have it).
# - setup.startup — MCP gateway registration (the hook that normally wins;
#   the backstop only covers runtimes that skip mixin startup hooks).
#
# The permissive OpenCode config (and the combined provider config)
# ships with mixins/global-opencode-config. No network rules: capability
# egress comes from the other mixins.
schemaVersion: "2"
kind: mixin
name: base
displayName: OpenCode agent baseline
description: >
  The kit entrypoint runtime, AGENTS.md logic, and MCP gateway every
  OpenCode kit sandbox composes: the entrypoint runtime (mixin hook
  runner, opencode autostart, login shell on exit), the agent guidance
  files, the shared AGENTS.md base, the AGENTS.md rebuild hook (sourced
  by the runtime), MCP gateway registration (startup hook +
  idempotent backstop), and the toolchain install library mixin
  setup.install steps source (check-and-install helpers so any mixin
  composes on any base template image). No network rules — capability
  egress comes from the other mixins.
version: 0.3.1

setup:
  startup:
    # MCP gateway registration (no-op when MCP isn't enabled). sandboxd
    # injects MCP_GATEWAY_URL + MCP_SENTINEL_TOKEN_NAME; the sentinel name
    # is not a credential — the proxy substitutes the real token at request
    # time. opencode owns ~/.config/opencode/opencode.json, so write it
    # fresh. The base mixin's hooks.d/mcp-gateway.sh backstop re-registers
    # only if this hook didn't run and the file is still missing.
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "mcp": {
              "mcp-gateway": {
                "type": "remote",
                "url": "$MCP_GATEWAY_URL",
                "enabled": true,
                "headers": {
                  "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                }
              }
            }
          }
          EOF
      user: "agent"
      description: Register the sandbox MCP gateway in ~/.config/opencode/opencode.json

# Files dropped into the sandbox home (see the header for the layout):
# .sandbox-kit/entrypoint.sh, .sandbox-kit/hooks.d/*.sh,
# .sandbox-agents.md, .sandbox-agents/*.md.
