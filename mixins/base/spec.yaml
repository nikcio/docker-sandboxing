# OpenCode sandbox baseline: everything the OpenCode kits share, as one
# mixin. Every sandbox built from a kit-<stack>/ spec composes this mixin —
# the kit entrypoints exec the runtime script shipped here and would refuse
# to start without it (a clear error drops you into a login shell).
#
# Ships:
# - files/home/.config/opencode/opencode.jsonc — the permissive OpenCode
#   config (edit/bash/webfetch allowed; the sandbox is the isolation
#   boundary). Lives in the global config layer as opencode.jsonc; the
#   sandbox-managed opencode.json (MCP gateway wiring) is a separate file
#   and both are merged by OpenCode.
# - files/home/.sandbox-agents.md — the shared AGENTS.md base (stack facts
#   come from the stack mixins' .sbx-agents.d/ notes).
# - files/home/.sandbox-agents/*.md — the guidance files the base links to
#   (persistent shell env, network access, git auth, workspace mode).
# - files/home/.sandbox-kit/entrypoint.sh — the entrypoint runtime: env
#   guard, AGENTS.md rebuild, banner, MCP backstop, opencode autostart,
#   login shell on exit.
# - setup.startup — background apt cache update + MCP gateway registration
#   (the entrypoint script carries an idempotent MCP backstop in case a
#   runtime skips mixin startup hooks).
#
# No network rules: capability egress comes from the other mixins.
schemaVersion: "2"
kind: mixin
name: base
displayName: OpenCode sandbox baseline
description: >
  The shared baseline every OpenCode kit sandbox composes: permissive
  OpenCode config, agent guidance files, the shared AGENTS.md base, the
  entrypoint runtime (env guard, banner, opencode autostart, login shell
  on exit), and the startup hooks (background apt cache update, MCP
  gateway registration). No network rules — capability egress
  comes from the other mixins.
version: 0.1.0

setup:
  startup:
    - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true) &"]
      user: "root"
      description: Update apt package cache in background
    # MCP gateway registration (no-op when MCP isn't enabled). sandboxd
    # injects MCP_GATEWAY_URL + MCP_SENTINEL_TOKEN_NAME; the sentinel name
    # is not a credential — the proxy substitutes the real token at request
    # time. opencode owns ~/.config/opencode/opencode.json, so write it
    # fresh. The shared entrypoint script re-registers only if this hook
    # didn't run and the file is still missing.
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "mcp": {
              "mcp-gateway": {
                "type": "remote",
                "url": "$MCP_GATEWAY_URL",
                "enabled": true,
                "headers": {
                  "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                }
              }
            }
          }
          EOF
      user: "agent"
      description: Register the sandbox MCP gateway in ~/.config/opencode/opencode.json

# Files dropped into the sandbox home (see the header for the layout):
# opencode.jsonc, .sandbox-agents.md, .sandbox-agents/*.md,
# .sandbox-kit/entrypoint.sh.
