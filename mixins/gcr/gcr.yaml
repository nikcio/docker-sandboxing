# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Google Container Registry
description: >
  Network rules so the in-sandbox Docker engine can pull base images and
  build containers.
version: "0.1.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Google Container Registry (+ the blob-redirect host)
          - gcr.io:443
          - "*.gcr.io:443"
          - storage.googleapis.com:443
