name: Publish images to Docker Hub

on:
  release:
    types: [ published ]

permissions:
  contents: read

env:
  IMAGE_PREFIX: docker.io/nikcio

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read image list
        id: images
        run: echo "images=$(jq -c '.images' images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Verify published kit references this image
        if: ${{ matrix.spec != '' }}
        run: |
          image="${IMAGE_PREFIX}/${{ matrix.name }}:v${VERSION}"
          grep -qF "$image" "${{ matrix.spec }}" || {
            echo "::error::${{ matrix.spec }} does not reference $image"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:v${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
