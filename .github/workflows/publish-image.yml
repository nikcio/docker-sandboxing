name: Publish images to Docker Hub

on:
  release:
    types: [ published ]

permissions:
  contents: read

env:
  IMAGE_PREFIX: docker.io/nikcio

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image list
        id: images
        run: echo "images=$(jq -c '.images' images.json)" >> "$GITHUB_OUTPUT"

  # Every image builds from its v3 descriptor with the sandbox-kit
  # frontend — plain OCI images whose manifest annotation carries the
  # validated descriptor. The kit-*/ workloads bake their stack toolchain
  # on the shell base image directly, so no ordering between jobs is
  # needed. Each workload kit verifies that the release version is
  # referenced in its own Dockerfile release block, which release-please
  # rewrote in the release PR.
  build:
    runs-on: ubuntu-latest
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

      - name: Verify released version is pinned
        if: ${{ matrix.verify != '' }}
        run: |
          version="v${VERSION}"
          grep -qF ":${version}" "${{ matrix.verify }}" || {
            echo "::error::${{ matrix.verify }} does not reference ${version}"
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.descriptor }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:v${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
