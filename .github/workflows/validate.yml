name: Validate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Image entries from images.json (same source of truth as
  # publish-image.yml) — feeds all jobs' matrices.
  images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
      templates: ${{ steps.images.outputs.templates }}
      kits: ${{ steps.images.outputs.kits }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image list
        id: images
        run: |
          echo "images=$(jq -c '.images' images.json)" >> "$GITHUB_OUTPUT"
          echo "templates=$(jq -c '[.images[] | select(.descriptor == null)]' images.json)" >> "$GITHUB_OUTPUT"
          echo "kits=$(jq -c '[.images[] | select(.descriptor != null)]' images.json)" >> "$GITHUB_OUTPUT"

  # Every kit and mixin builds with the v3 sandbox-kit frontend (the
  # descriptor's # syntax= line dispatches it). The build validates the
  # descriptor strictly — sbx kit validate has no v3 source-kit path, and
  # buildx --check cannot run foreign frontends, so a real build is the
  # only local validation. No Docker login needed: layers stay local.
  # Pushing happens in publish-image.yml at release time.
  #
  # Workload kit descriptors pin the released template image
  # (docker.io/nikcio/opencode-<stack>:vX.Y.Z), which does not exist
  # until a release is published — on PRs, the base is staged locally
  # from the template context under that tag first.
  kits-mixins:
    name: Kit or mixin (v3 frontend build)
    runs-on: ubuntu-latest
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.images.outputs.kits) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Stage pinned base image (workload kit)
        if: ${{ matrix.context != 'kit' }}
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          stack="$(sed 's/^kit-//' <<< "${{ matrix.context }})")
          # Build the stack template locally and tag it as the release ref
          # the kit descriptor pins (published only at release time).
          docker buildx build "template-${stack}" \
            --tag "docker.io/nikcio/opencode-${stack}:v${version}"

      - name: Build ${{ matrix.context }} (descriptor)
        run: |
          docker buildx build "${{ matrix.context }}" \
            --file "${{ matrix.context }}/${{ matrix.descriptor }}" \
            --platform linux/amd64

  # Static build checks for every publishable template Dockerfile.
  # The --check mode runs the BuildKit frontend checks without executing
  # the build steps; full builds stay in publish-image.yml at release
  # time. (Kit/mixin validation is the kits-mixins job above.)
  dockerfiles:
    name: Dockerfile (buildx check)
    runs-on: ubuntu-latest
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.images.outputs.templates) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Check ${{ matrix.context }}/Dockerfile
        run: docker buildx build --check "${{ matrix.context }}"
