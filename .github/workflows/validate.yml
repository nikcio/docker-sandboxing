name: Validate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Image contexts from images.json (same source of truth as
  # publish-image.yml) — feeds the dockerfiles job's matrix.
  images:
    runs-on: ubuntu-latest
    outputs:
      contexts: ${{ steps.contexts.outputs.contexts }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read image contexts
        id: contexts
        run: echo "contexts=$(jq -c '[.images[] | {context}]' images.json)" >> "$GITHUB_OUTPUT"

  # Validate every kit and mixin with the sandbox CLI's own validator —
  # the same check scripts/bootstrap.sh runs locally. sbx (docker-sbx)
  # comes from Docker's apt repo (see mixins/sbx/spec.yaml); validation
  # is local and needs no Docker login.
  kits-mixins:
    name: Kits & mixins (sbx kit validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install sbx (docker-sbx)
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends docker-sbx
          sbx version

      - name: Validate mixins
        run: |
          for mixin in mixins/*/; do
            echo "::group::sbx kit validate ${mixin}"
            sbx kit validate "${mixin}"
            echo "::endgroup::"
          done

      - name: Validate kits
        run: |
          for kit in kit*/; do
            echo "::group::sbx kit validate ${kit}"
            sbx kit validate "${kit}"
            echo "::endgroup::"
          done

  # Static build checks for every publishable template Dockerfile. The
  # --check mode runs the BuildKit frontend checks without executing the
  # build steps; full builds stay in publish-image.yml at release time.
  dockerfiles:
    name: Dockerfile (buildx check)
    runs-on: ubuntu-latest
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.images.outputs.contexts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Check ${{ matrix.context }}/Dockerfile
        run: docker buildx build --check "${{ matrix.context }}"
