name: Validate

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Image entries from images.json (same source of truth as
  # publish-image.yml) — feeds the build matrix.
  images:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read image list
        id: images
        run: echo "images=$(jq -c '.images' images.json)" >> "$GITHUB_OUTPUT"

  # Every workload kit builds with the v3 sandbox-kit frontend (the
  # descriptor's # syntax= line dispatches it) for both publish
  # platforms, amd64 and arm64 — the strict descriptor decode validates
  # identically either way, and the arm64 half catches arch-blind recipe
  # changes before a release does. sbx kit validate has no v3
  # source-kit path and buildx --check cannot run foreign frontends, so
  # a real build is the only local validation. No Docker login needed:
  # layers stay local. Pushing happens in publish-image.yml at release
  # time. Mixins are consumed as git references and validated by the
  # sandboxes that build them; they carry no images.json entry.
  #
  # One job per (kit, platform) rather than a joined --platform build:
  # a PR breaking only arm64 then reports exactly that, instead of one
  # opaque failure. QEMU registers binfmt for the arm64 RUN steps.
  kits:
    name: Workload kit (v3 frontend build, ${{ matrix.platform }}, ${{ matrix.kit }})
    runs-on: ubuntu-latest
    needs: images
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [ linux/amd64, linux/arm64 ]
        # stacks mirrored from images.json (flat scalars so the check
        # names are deterministic — see docs/repo-setup.md)
        kit: [ dotnet, go, node, python, rust ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build kit-${{ matrix.kit }} (descriptor)
        run: |
          docker buildx build "kit-${{ matrix.kit }}" \
            --file "kit-${{ matrix.kit }}/kit-${{ matrix.kit }}.yaml" \
            --platform ${{ matrix.platform }}
