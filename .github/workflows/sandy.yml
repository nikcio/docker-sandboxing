name: Sandy CI

on:
  pull_request:
    paths:
      - 'sandy/**'
      - '.github/workflows/sandy.yml'
  push:
    branches: [ main ]
    paths:
      - 'sandy/**'
      - '.github/workflows/sandy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sandy/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: sandy
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: sandy
        run: pnpm build

  rust:
    name: Rust (fmt + clippy + check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev file

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sandy/src-tauri/target
          key: rust-ci-${{ runner.os }}-${{ hashFiles('sandy/src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-ci-${{ runner.os }}-

      - name: rustfmt
        working-directory: sandy/src-tauri
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: sandy/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        working-directory: sandy/src-tauri
        run: cargo check --all-targets
