name: Preview Release

# Preview releases: pre-release versions (v3.1.0-beta001) cut on demand from
# current main. Complements the stable release-please flow:
#
# 1. Run this workflow (Actions → Preview Release → Run workflow). It opens a
#    preview release PR with a CHANGELOG entry and rewritten `&ref=` pins,
#    then queues it for auto-merge.
# 2. The merge triggers this workflow's push job, which tags the prerelease,
#    builds Sandy, and publishes the GitHub release marked as a prerelease.
#
# Preview release PRs are only ever opened by manual dispatch: push runs pass
# skip-github-pull-request, so landing regular commits on main never opens
# one.
#
# The next stable release PR supersedes any previews: it releases the same
# commits again as a full version (see agent-guidance/versioning.md).

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Generate preview release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-preview-config.json
          manifest-file: .release-please-preview-manifest.json
          token: ${{ steps.app-token.outputs.token }}
          # push runs only tag a merged preview release PR; opening preview
          # release PRs happens exclusively on manual dispatch
          skip-github-pull-request: ${{ github.event_name != 'workflow_dispatch' }}

      - name: Auto-merge preview release PR
        # The job above opens (or updates) the preview release PR; queue it
        # for auto-merge (requires the repo setting "Allow auto-merge"). The
        # PR is created by the GitHub App, so the required checks run on it
        # and GitHub merges when they pass. The merge commit then triggers
        # the push run of this workflow, which tags the prerelease.
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "${PR}" | jq -r '.number')
          echo "Queueing auto-merge for preview release PR #${PR_NUMBER}"
          gh pr merge "${PR_NUMBER}" --auto --merge

  sandy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/sandy-build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
      prerelease: true
