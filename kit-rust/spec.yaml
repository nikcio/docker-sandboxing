schemaVersion: "2"
kind: sandbox
name: opencode-rust
displayName: OpenCode (Rust)

# Thin sandbox kit: OpenCode agent on the built-in Docker template image
# (docker/sandbox-templates:opencode-docker). Same shape as ../kit/ (the
# base kit) — the only differences are the name/displayName and the
# version block. The stack toolchain is not baked in; compose the stack
# mixin from ../mixins/<stack>/ plus any other mixins to add capabilities
# (model provider, network areas, workflow rules). See ../docs/.
#
# The version is bumped by release-please.
# x-release-please-start-version
version: 2.3.0

sandbox:
  # Docker's built-in opencode template image.
  image: docker/sandbox-templates:opencode-docker
# x-release-please-end-version
  entrypoint: [opencode]

environment:
  variables:
    # C.UTF-8 is always present on glibc (no locale-gen needed); without
    # it man-db's profile script prints "manpath: can't set the locale"
    # on every shell start (the base image ships no locale env).
    LANG: C.UTF-8
    LC_ALL: C.UTF-8

agentInstructions:
  filename: AGENTS.md
