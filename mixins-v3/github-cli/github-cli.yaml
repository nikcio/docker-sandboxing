# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: GitHub CLI
description: >
  Installs the GitHub CLI (gh) as an image layer, with the egress gh and
  git-over-HTTPS need, and a startup hook that locks the git committer
  identity to the owner of the github credential.

# No credential entry: the built-in agent kits (opencode, shell,
# docker-agent) already declare the `github` credential, and composition
# conflicts when two artifacts define the same (service, phase). The
# built-in credential is proxy-managed on the same hosts this mixin needs
# (github.com, api.github.com, raw.githubusercontent.com), so `gh` and
# git-over-HTTPS get the real token at the proxy with only the sentinel in
# the VM. Register it host-side with `sbx secret set github`
# (see ../../docs/github-pat.md).

args:
  ghVersion:
    default: ""
    pattern: '^$|^[0-9]+(\.[0-9]+)*$'
    description: GitHub CLI version to install (empty = latest apt package)
    buildArg: GH_VERSION_ARG

# The installs resolve "latest" at build, so the exact version is not
# knowable ahead of the build: provides the primary tool unversioned and
# lets the descriptor's version fallback answer version-constrained
# requires (SPEC-v3 5.2: an unversioned provide only matches
# unconstrained requires).
provides:
  - gh

version: "1.0.0"

dockerfile: github-cli.dockerfile

capabilities:
  # The identity lock must run as root (it writes /etc/gitconfig and
  # replaces /usr/local/bin/git), so unlike the other lifecycle hooks in
  # this repo this one is not the agent user. GH_TOKEN is declared because
  # hook env is deny-by-default: gh only sees the sentinel token, but it
  # needs the variable set to make the `gh api user` request the proxy
  # then re-authorizes with the real credential.
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - bash
            - -c
            - |
              # Force the git committer identity from the github credential
              # and prevent the agent from overriding it. Not bulletproof:
              # the agent can still set the author per commit
              # (git commit --author=...) or call a git binary directly.
              set -e
              agent_home=/home/agent
              if ! command -v gh >/dev/null 2>&1; then
                echo "gh not available; skipping git identity setup" >&2
                exit 0
              fi
              # No public email on the account -> GitHub's noreply commit
              # address, matching what the GitHub web UI commits with.
              if ! name="$(gh api user --jq '.name // .login')" ||
                 ! email="$(gh api user --jq '.email // ((.id|tostring) + "+" + .login + "@users.noreply.github.com")')"; then
                echo "Could not resolve the GitHub user from the github credential; skipping git identity setup" >&2
                exit 0
              fi
              git_path="$(command -v git || true)"
              if [ -z "$git_path" ]; then
                echo "git not available; skipping git identity setup" >&2
                exit 0
              fi
              # The wrapper below takes /usr/local/bin/git; if that path
              # already is a wrapper, resolve to the real binary underneath.
              if [ "$git_path" = "/usr/local/bin/git" ]; then
                git_path=/usr/bin/git
              fi
              export HOME="$agent_home"
              # A previous start may have left the configs immutable; clear the
              # flag first so re-runs can rewrite them instead of failing.
              chattr -i /etc/gitconfig 2>/dev/null || true
              chattr -i "$agent_home/.gitconfig" 2>/dev/null || true
              "$git_path" config --global user.name "$name"
              "$git_path" config --global user.email "$email"
              "$git_path" config --global --replace-all safe.directory '*'
              # Non-interactive defaults: no editor is available in the sandbox,
              # so merge/rebase must never try to open one.
              "$git_path" config --global core.editor true
              "$git_path" config --global pull.rebase false
              "$git_path" config --global merge.ff false
              {
                printf 'GIT_AUTHOR_NAME=%q\n' "$name"
                printf 'GIT_AUTHOR_EMAIL=%q\n' "$email"
                printf 'GIT_COMMITTER_NAME=%q\n' "$name"
                printf 'GIT_COMMITTER_EMAIL=%q\n' "$email"
              } > /etc/git-identity
              chmod 644 /etc/git-identity
              # Wrapper around the real git binary: exports the locked
              # identity and refuses `git config` overrides of user.name /
              # user.email while letting reads through.
              {
                echo '#!/bin/bash'
                echo 'if [ -r /etc/git-identity ]; then'
                echo '  set -a'
                echo '  . /etc/git-identity'
                echo '  set +a'
                echo 'fi'
                echo 'if [ "$1" = "config" ]; then'
                echo '  nargs=0'
                echo '  for arg in "$@"; do'
                echo '    case "$arg" in'
                echo '      --*) ;;'
                echo '      config) ;;'
                echo '      *) nargs=$((nargs + 1)) ;;'
                echo '    esac'
                echo '  done'
                echo '  case "$*" in'
                echo '    user.config|*user.name*|*user.email*)'
                echo '      if [ "$nargs" -ge 2 ]; then'
                echo '        echo "ERROR: git identity is managed by the sandbox and cannot be overridden" >&2'
                echo '        exit 1'
                echo '      fi'
                echo '      if [ "$nargs" -eq 1 ]; then'
                echo '        echo "git identity is managed by the sandbox; $1 <name|email> is ignored" >&2'
                echo '      fi'
                echo '      ;;'
                echo '  esac'
                echo 'fi'
                echo "exec $git_path \"\$@\""
              } > /usr/local/bin/git
              chmod 755 /usr/local/bin/git
              # System and agent configs pinned to the locked identity and
              # made read-only (best effort: chattr needs the fs to support
              # the immutable flag).
              {
                echo '[user]'
                echo "	name = $name"
                echo "	email = $email"
              } > /etc/gitconfig
              chown root:root /etc/gitconfig
              chmod 644 /etc/gitconfig
              chattr +i /etc/gitconfig 2>/dev/null || true
              chown root:root "$agent_home/.gitconfig" 2>/dev/null || true
              chmod 644 "$agent_home/.gitconfig" 2>/dev/null || true
              chattr +i "$agent_home/.gitconfig" 2>/dev/null || true
          user: "root"
          env: [GH_TOKEN]
          description: >
            Lock the git committer identity to the owner of the github
            credential: resolve name/email via gh, write them into the
            global git configs (made read-only), and install a git wrapper
            that refuses identity overrides

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # gh CLI (package + keyring are baked at build; kept for
          # `apt-get upgrade` runs inside the sandbox)
          - cli.github.com:443

          - github.com
          - "*.github.com"
          - "*.githubusercontent.com"
