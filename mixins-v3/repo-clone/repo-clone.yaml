# syntax=docker/sandbox-kit:3
# Clones extra GitHub repositories into the sandbox workspace at creation.
#
# Compose with the github-cli mixin: the clone authenticates through the
# proxy-managed github credential the built-in agent kit declares (the
# real token is injected by the proxy into requests to github.com; the
# in-container GH_TOKEN is only a sentinel), so private repositories the
# token can read clone fine and the token itself never enters the sandbox.
#
# The repository list comes from the `repositories` kit argument: one
# `owner/repo` per line (whitespace-separated also works). In an
# sbxenv.yaml, pass it from an environment argument:
#
#   args:
#     repos:
#       default: "owner/repo-a owner/repo-b"
#   kits:
#     - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins-v3/repo-clone&ref=<tag>
#       args:
#         repositories: ${{ env.args.repos }}
#
# The value is interpolated into a single-quoted shell string, so a `'` in
# a repository name would break the quoting. Stick to owner/repo names
# (they cannot contain quotes anyway).
#
# Repositories the token cannot access (or that do not exist) are skipped
# with a warning, so one bad entry never fails the sandbox. Existing
# directories are left untouched (idempotent re-creates).
#
# This mixin is declaration-only: the clone is a lifecycle install hook,
# no image content. The install hook's env list names WORKSPACE_DIR
# explicitly because hook environments are deny-by-default in v3.
schemaVersion: "3"
kind: mixin
displayName: Repository clone
description: >
  Clones extra GitHub repositories (owner/repo list from the
  `repositories` kit argument) into the workspace at sandbox creation.
  Auth goes through the proxy-managed github credential the
  built-in agent kit declares; repositories the token cannot access
  are skipped with a warning.

args:
  repositories:
    default: ""
    description: >
      Repositories to clone, one owner/repo per line (whitespace
      separated also works), e.g. "owner/api owner/docs". Empty = clone
      nothing.

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Literal block (`|`), not folded (`>`): folding joins the
        # script lines with spaces and breaks the syntax.
        - command: |
            set -e
            repos="$(printf '%s' '${{ kit.args.repositories }}' | tr '\n' ' ')"
            [ -z "$(printf '%s' "$repos" | tr -d '[:space:]')" ] && exit 0
            target="${WORKSPACE_DIR:-/home/agent/workspace}"
            mkdir -p "$target"
            git_path="$(command -v git || true)"
            if [ -z "$git_path" ]; then
              echo "repo-clone: git not available; skipping" >&2
              exit 0
            fi
            [ "$git_path" = "/usr/local/bin/git" ] && git_path=/usr/bin/git
            err_file="$(mktemp)"
            trap 'rm -f "$err_file"' EXIT
            for repo in $repos; do
              case "$repo" in
                */*/*|/*/*) echo "repo-clone: skipping '$repo' (expected owner/repo)" >&2; continue ;;
                */*) name="${repo#*/}"; name="${name%.git}" ;;
                *) echo "repo-clone: skipping '$repo' (expected owner/repo)" >&2; continue ;;
              esac
              if [ -e "$target/$name" ] || [ -L "$target/$name" ]; then
                echo "repo-clone: $target/$name already exists; skipping clone of $repo" >&2
                continue
              fi
              if "$git_path" clone --depth 1 "https://github.com/$repo.git" "$target/$name" 2>"$err_file"; then
                echo "repo-clone: cloned $repo into $target/$name"
              else
                echo "repo-clone: WARNING: could not clone $repo (no access with the github token, or the repository does not exist):" >&2
                sed 's/^/  /' "$err_file" >&2
                rm -rf "$target/$name"
              fi
            done
          user: "agent"
          env: [WORKSPACE_DIR]
          description: >
            Clone the repositories listed in the `repositories` kit argument
            into the workspace (skips ones the github token cannot access)
