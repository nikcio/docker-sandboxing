# syntax=docker/sandbox-kit:3
# The v2 mixin installs zsh + Oh My Zsh into the agent home in a
# create-time hook; the v3 kit bakes both into the image (zsh's file tree
# at its system paths, Oh My Zsh under /opt — a mixin's layers are an
# overlay on an unknown base, so they must not claim /home/agent paths)
# and hands the Oh My Zsh tree and .zshrc to the agent with a startup
# hook.
schemaVersion: "3"
kind: mixin
displayName: Zsh + Oh My Zsh
description: >
  Installs zsh with Oh My Zsh and makes it the agent's login shell.

args:
  zshVersion:
    default: ""
    pattern: '^$|^[0-9][0-9A-Za-z.+~:-]*$'
    description: zsh apt package version to install (empty = latest apt candidate)
    buildArg: ZSH_VERSION_ARG
  ohMyZshRef:
    default: ""
    pattern: '^$|^[A-Za-z0-9._/-]+$'
    description: Oh My Zsh git ref to clone (empty = master HEAD)
    buildArg: OH_MY_ZSH_REF_ARG

# The installs resolve "latest" at build, so the exact version is not
# knowable ahead of the build: provides the primary tool unversioned and
# lets the descriptor's version fallback answer version-constrained
# requires (SPEC-v3 5.2: an unversioned provide only matches
# unconstrained requires).
provides:
  - zsh

version: "1.0.0"

dockerfile: zsh.dockerfile

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        # Runs on every boot, so a base whose login shell or .zshrc changed
        # underneath (or a fresh volume) gets the same setup re-applied.
        # zsh and Oh My Zsh are baked into the image; this re-points the
        # login shell and copies the Oh My Zsh tree + .zshrc into the agent
        # home, all idempotent.
        - command:
            - sh
            - -c
            - |
              set -e
              if [ "$(getent passwd agent | cut -d: -f7)" != "/usr/bin/zsh" ]; then
                # chsh goes through PAM, which fails on bases where the
                # chsh PAM stack can't authenticate the passwordless agent
                # user ("chsh: PAM: Authentication failure"): edit
                # /etc/passwd directly instead.
                sed -i 's|^\(agent:[^:]*:[^:]*:[^:]*:[^:]*:[^:]*:\).*|\1/usr/bin/zsh|' /etc/passwd
              fi
              # The Oh My Zsh tree must live in the agent home: the stock
              # .zshrc template points $ZSH at $HOME/.oh-my-zsh, and a
              # root-owned /opt tree would also break compinit's cache and
              # omz updates. Copy it once, then leave it agent-owned.
              if [ ! -d /home/agent/.oh-my-zsh ]; then
                cp -a /opt/oh-my-zsh /home/agent/.oh-my-zsh
                chown -R agent:agent /home/agent/.oh-my-zsh
              fi
              if [ ! -f /home/agent/.zshrc ]; then
                cp /opt/oh-my-zsh/templates/zshrc.zsh-template /home/agent/.zshrc
                chown agent:agent /home/agent/.zshrc
              fi
          user: "root"
          description: >
            Make zsh the agent's login shell and seed .zshrc from the baked
            Oh My Zsh template (idempotent)

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # Oh My Zsh repo (framework updates)
          - github.com:443
          - "*.github.com:443"
          - raw.githubusercontent.com:443
          # ohmyz.sh: docs and wiki referenced by the framework itself
          - ohmyz.sh:443
