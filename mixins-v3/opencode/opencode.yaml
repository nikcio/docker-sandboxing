# syntax=docker/sandbox-kit:3
# Installs OpenCode 2 (official curl installer, pinned at build), ships
# the permissive opencode config, and merges configs from other mixins
# using fragments (enabled_*/disabled_* lists union) at startup.
#
# The v2 mixin installs into the agent home at create; the v3 kit bakes
# the binary and config into the image under /opt (a mixin's layers are an
# overlay on an unknown base, so its content must not claim /home/agent
# paths the base or the agent user owns) and hands them to the agent at
# startup.
schemaVersion: "3"
kind: mixin
displayName: OpenCode
description: >
  Installs OpenCode 2 as an image layer (official curl installer), ships
  the permissive opencode config, and merges configs from other mixins
  using fragments (enabled_*/disabled_* lists union).

args:
  opencodeVersion:
    default: ""
    pattern: '^$|^v?[0-9]+(\.[0-9]+)*$'
    description: OpenCode version to install (empty = latest)
    buildArg: OPENCODE_VERSION_ARG

# The installs resolve "latest" at build, so the exact version is not
# knowable ahead of the build: provides the primary tool unversioned and
# lets the descriptor's version fallback answer version-constrained
# requires (SPEC-v3 5.2: an unversioned provide only matches
# unconstrained requires).
provides:
  - opencode

version: "1.0.0"

dockerfile: opencode.dockerfile

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - bash
            - -c
            - |
              set -euo pipefail

              FRAG_DIR="${OPENCODE_MIXINS_DIR:-$HOME/.config/opencode/mixins.d}"
              OUT="${1:-$HOME/.config/opencode/sandbox-mixins.jsonc}"

              mkdir -p "$(dirname "$OUT")"

              seed() {
                  # Nothing to merge: write the minimal valid config so OPENCODE_CONFIG
                  # always points at a loadable file.
                  printf '{\n  "$schema": "https://opencode.ai/config.json"\n}\n'
              }

              fail() {
                  echo "ERROR [mixins-config]: $*" >&2
                  exit 1
              }

              if [ ! -d "$FRAG_DIR" ]; then
                  seed > "$OUT"
                  echo "[mixins-config] no mixins fragments ($FRAG_DIR missing): wrote the empty combined config"
                  exit 0
              fi

              shopt -s nullglob
              fragments=("$FRAG_DIR"/*.json)
              jsonc=("$FRAG_DIR"/*.jsonc)
              shopt -u nullglob

              if [ "${#jsonc[@]}" -gt 0 ]; then
                  fail "comment-bearing fragments are not supported: ${jsonc[*]}: mixins fragments in $FRAG_DIR must be comment-free .json (jq does the merging)"
              fi

              if [ "${#fragments[@]}" -eq 0 ]; then
                  seed > "$OUT"
                  echo "[mixins-config] no mixins fragments in $FRAG_DIR: wrote the empty combined config"
                  exit 0
              fi

              tmp="$(mktemp "$(dirname "$OUT")/.sandbox-mixins.jsonc.XXXXXX")"
              tmp_wrapped="${tmp}.wrapped"
              trap 'rm -f "$tmp" "$tmp_wrapped"' EXIT

              if command -v jq > /dev/null 2>&1; then
                  for f in "${fragments[@]}"; do
                      if ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
                          fail "$f is not a valid JSON object: fix or remove it (the previous combined config was left in place)"
                      fi
                  done
                  # Object values merge recursively; later fragments win scalar
                  # conflicts (jq's `*`). Array-valued keys whose name starts
                  # with "enabled_" or "disabled_" (e.g. enabled_mixins,
                  # enabled_providers) are unioned instead: that is what lets
                  # mixins compose (zeldoc + copilot both stay enabled).
                  jq -s '
                  def unionkey:
                      [keys[] | select(test("^enabled_|^disabled_"))] | .[];
                  reduce .[] as $f (
                      {};
                      . as $acc
                      | (. * $f)
                      + (reduce ($f | unionkey) as $k ({};
                          .[$k] = ((($acc[$k] // []) + ($f[$k] // [])) | unique)))
                  )
                  ' "${fragments[@]}" > "$tmp"
              elif [ "${#fragments[@]}" -eq 1 ]; then
                  # jq-less fallback: a single fragment needs no merging.
                  cp -- "${fragments[0]}" "$tmp"
              else
                  fail "jq is not available and there are ${#fragments[@]} fragments to merge: install jq (the base image ships it)"
              fi

              {
                  printf '// GENERATED by the opencode mixin startup command: do not edit.\n'
                  printf '// Fragments: %s\n' "$(basename -a "${fragments[@]}" | paste -sd' ' -)"
                  printf '// Edit the owning mixin in docker-sandboxing (or a mixins.d/ fragment) and restart the sandbox.\n'
                  cat "$tmp"
              } > "${tmp}.wrapped"
              mv -f "${tmp}.wrapped" "$OUT"

              echo "[mixins-config] merged ${#fragments[@]} mixins fragment(s) ($(basename -a "${fragments[@]}" | paste -sd' ' -)) -> $OUT"
          user: "agent"
          description: Merge mixins fragments into the combined OPENCODE_CONFIG
      files:
        # HOME-relative path: the final container environment's $HOME is
        # /home/agent on the platform floor, and writing as the agent keeps
        # the config file the agent's to edit. overwrite: false — the agent
        # or a local override may already have one; never clobber it.
        - path: /home/agent/.config/opencode/opencode.json
          mode: "0644"
          overwrite: false
          description: Permissive OpenCode config (sandbox is the isolation boundary)
          content: |
            {
              "$schema": "https://opencode.ai/config.json",
              "autoupdate": false,
              "share": "disabled",
              "permissions": [
                { "action": "edit", "resource": "*", "effect": "allow" },
                { "action": "read", "resource": "*", "effect": "allow" },
                { "action": "shell", "resource": "*", "effect": "allow" },
                { "action": "webfetch", "resource": "*", "effect": "allow" },
                { "action": "glob", "resource": "*", "effect": "allow" },
                { "action": "grep", "resource": "*", "effect": "allow" },
                { "action": "question", "resource": "*", "effect": "allow" },
                { "action": "skill", "resource": "*", "effect": "allow" },
                { "action": "subagent", "resource": "*", "effect": "allow" },
                { "action": "todowrite", "resource": "*", "effect": "allow" },
                { "action": "external_directory", "resource": "*", "effect": "allow" },
                { "action": "websearch", "resource": "*", "effect": "deny" }
              ]
            }

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          # opencode.ai serves the installer script and the latest-version
          # metadata (baked at build; kept for agent-driven installs/updates)
          - opencode.ai:443
          - "*.opencode.ai:443"

          # The installer downloads the platform tarball from the npm
          # registry, and plugins/MCP servers install from npm at start.
          - registry.npmjs.org:443
          - "*.npmjs.org:443"
