# syntax=docker/sandbox-kit:3
# Workspace .env guard: the workspace must never contain a .env file.
#
# Ships as a lifecycle startup hook (runs before the agent starts, every
# boot). What counts: the literal name .env plus the dotenv variants
# loaders pick up (.env.local, .env.production, ...). Symlinks count too,
# since a committed .env symlink to a host-side file would otherwise slip
# past `-type f` and be read by the agent. The clone-mode deletion uses
# rm -f -- on the found path only (never the symlink's target): deleting
# a symlink removes the link, not the file it points at.
#
# No network rules: capability egress comes from the other mixins.
schemaVersion: "3"
kind: mixin
displayName: Workspace .env guard
description: >
  Enforces the no-.env policy in the workspace: clone mode removes .env
  files (including .env.local-style variants and symlinked .env files)
  from the sandbox-local copy (warning + short pause), direct mode
  refuses to start when one exists. No network rules; capability
  egress comes from the other mixins.

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      startup:
        - command:
            - sh
            - -c
            - |
              # The workspace must never contain a .env file. Clone mode
              # removes offenders from the sandbox-local copy; direct mode
              # (host tree mounted in place) refuses to start instead of
              # deleting host files. No-op when there is no workspace
              # (WORKSPACE_DIR unset). The fatal branch exits nonzero, and
              # the sandbox refuses to start.
              __envs=""
              __clean="workspace clean (no .env files)"
              if [ -n "${WORKSPACE_DIR:-}" ]; then
                __envs="$(find "$WORKSPACE_DIR" \( -type f -o -type l \) \
                  \( -name .env -o -name '.env.*' \) \
                  ! -name '.env.example' ! -name '.env.sample' ! -name '.env.template' \
                  -not -path '*/.git/*' 2>/dev/null)"
              else
                __clean="workspace not checked (WORKSPACE_DIR is not set)"
              fi
              if [ -d /run/sandbox/source ]; then
                if [ -n "$__envs" ]; then
                  printf '%s\n' "$__envs" | while IFS= read -r __f; do rm -f -- "$__f"; done
                  echo "============================================================"
                  echo "WARNING [env-guard]: .env file(s) were removed from the"
                  echo "workspace (clone mode - sandbox-local copy):"
                  printf '%s\n' "$__envs" | sed 's/^/  - /'
                  echo "============================================================"
                  echo "[env-guard] the agent opens in 5 seconds..."
                  sleep 5
                fi
              elif [ -n "$__envs" ]; then
                echo "============================================================"
                echo "ERROR [env-guard]: .env file(s) found in the workspace (direct mode):"
                printf '%s\n' "$__envs" | sed 's/^/  - /'
                echo "This sandbox refuses to start with .env files in the workspace."
                echo "Delete them on the host (they are mounted into the sandbox), then recreate the sandbox."
                echo "============================================================"
                exit 1
              else
                echo "[env-guard] direct mode - $__clean"
              fi
              unset __envs __clean __f
          user: "agent"
          description: >
            Enforce the no-.env policy (clone mode removes offenders from
            the sandbox-local copy; direct mode refuses to start)
