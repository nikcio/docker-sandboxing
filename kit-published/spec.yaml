# Sandbox kit: OpenCode agent on the dotnet+node template.
#
# PUBLISHED VARIANT — what remote consumers fetch at a release tag:
#   git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-published&ref=vX.Y.Z
#
# sandbox.image points at the public template image on Docker Hub, built and
# pushed by .github/workflows/publish-image.yml when a release is published.
# release-please bumps the version + image tag between the x-release-please
# markers. Keep in sync with ../kit/spec.yaml (the dev kit).
#
# The kit is intentionally thin: template image + entrypoint + permissive
# OpenCode config. Compose capabilities at launch with the mixins from
# ../mixins/ via --kit flags or a .sbxenv.yaml kits: list (the spec's
# `mixins:` field is not applied by the runtime yet). See ../docs/.
#
# Validate: sbx kit validate kit-published/
schemaVersion: "2"
kind: sandbox
name: opencode-node-dotnet
displayName: OpenCode (.NET + Node)
description: >
  OpenCode agent running on a custom template with the .NET SDK, Node.js via
  NVM, PNPM, and Git preinstalled. Ships a permissive OpenCode config
  (edit/bash/webfetch allowed — the sandbox is the isolation boundary).
  The entrypoint is a login shell: it prints a startup banner, auto-starts
  opencode, and drops into the shell when opencode exits (relaunch with `o`).
  Compose the mixins from ../mixins/ to add capabilities (model provider,
  network areas, workflow rules). Enforces a no-.env policy in the workspace:
  refuses to start in direct mode when one exists, removes it in clone mode.
# The version and the image tag are bumped together by release-please.
# x-release-please-start-version
version: 0.6.0

sandbox:
  # Public image on Docker Hub, pushed by the publish-image workflow
  # (full docker.io prefix — sbx does not resolve the Docker Hub domain).
  image: docker.io/nikcio/opencode-node-dotnet:v0.6.0
# x-release-please-end-version
  # Login shell: banner, auto-start opencode, drop into the shell when
  # opencode exits (relaunch with `o`); quitting the shell ends the session.
  entrypoint:
    - bash
    - -c
    - |
      # Env guard, scan phase (reported under the banner below). The
      # workspace must never contain a .env file. Clone mode removes
      # offenders from the sandbox-local copy; direct mode (host tree
      # mounted in place) refuses to start instead of deleting host files.
      __envs=""
      __clean="workspace clean (no .env files)"
      __guard_fatal=0
      if [ -n "${WORKSPACE_DIR:-}" ]; then
        __envs="$(find "$WORKSPACE_DIR" -type f -name .env -not -path '*/.git/*' 2>/dev/null)"
      else
        __clean="workspace not checked (WORKSPACE_DIR is not set)"
      fi
      if [ -d /run/sandbox/source ]; then
        if [ -n "$__envs" ]; then
          printf '%s\n' "$__envs" | while IFS= read -r __f; do rm -f -- "$__f"; done
        fi
      elif [ -n "$__envs" ]; then
        __guard_fatal=1
      fi

      # Rebuild the sandbox AGENTS.md: the runtime's baseline can't be
      # replaced from the kit grammar, so overwrite it before opencode
      # starts with the kit's copy (~/.sandbox-agents.md) plus every mixin
      # note in ~/.sbx-agents.d/, keeping the runtime's Kits index section.
      __agents="$(dirname "${WORKSPACE_DIR:-}")/AGENTS.md"
      __mine="$HOME/.sandbox-agents.md"
      if [ -n "${WORKSPACE_DIR:-}" ] && [ -f "$__agents" ] && [ -f "$__mine" ]; then
        __kits="$(sed -n '/<!-- sbx:kits-section start -->/,/<!-- sbx:kits-section end -->/p' "$__agents")"
        {
          cat "$__mine"
          for __note in "$HOME"/.sbx-agents.d/*.md; do
            [ -f "$__note" ] || continue
            printf '\n'
            cat "$__note"
          done
          if [ -n "$__kits" ]; then printf '\n%s\n' "$__kits"; fi
        } > "$__agents"
      fi

      cat <<'BANNER'
      ------------------------------------------------------------
       Sandbox
      ------------------------------------------------------------
       opencode is starting automatically.
       - Quit opencode to drop into this shell
       - Relaunch opencode anytime with: o or opencode
      ------------------------------------------------------------
      BANNER

      # Env guard report: WARNING + 5s pause when files were deleted
      # (clone mode), fatal ERROR when the session is refused (direct).
      if [ "$__guard_fatal" = "1" ]; then
        echo "============================================================"
        echo "ERROR [env-guard]: .env file(s) found in the workspace (direct mode):"
        printf '%s\n' "$__envs" | sed 's/^/  - /'
        echo "This sandbox refuses to start with .env files in the workspace."
        echo "Delete them on the host (they are mounted into the sandbox), then recreate the sandbox."
        echo "============================================================"
        exit 1
      fi
      if [ -d /run/sandbox/source ]; then
        if [ -n "$__envs" ]; then
          echo "============================================================"
          echo "WARNING [env-guard]: .env file(s) were removed from the"
          echo "workspace (clone mode - sandbox-local copy):"
          printf '%s\n' "$__envs" | sed 's/^/  - /'
          echo "============================================================"
          echo "[env-guard] opencode opens in 5 seconds..."
          sleep 5
        fi
      else
        echo "[env-guard] direct mode - $__clean"
      fi

      if command -v opencode >/dev/null 2>&1; then
        opencode
        echo "opencode exited - back in the sandbox shell (relaunch: o or opencode)"
      else
        echo "WARNING: opencode not found in image - dropping to shell" >&2
      fi
      exec bash -il

setup:
  startup:
    - command: ["sh", "-c", "command -v apt-get > /dev/null 2>&1 && (apt-get update -qq -y > /dev/null 2>&1 || true) &"]
      user: "root"
      description: Update apt package cache in background
    # MCP gateway registration (no-op when MCP isn't enabled). sandboxd
    # injects MCP_GATEWAY_URL + MCP_SENTINEL_TOKEN_NAME; the sentinel name
    # is not a credential — the proxy substitutes the real token at request
    # time. opencode owns ~/.config/opencode/opencode.json, so write it fresh.
    - command:
        - sh
        - -c
        - |
          set -e
          [ -n "$MCP_GATEWAY_URL" ] || exit 0
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "mcp": {
              "mcp-gateway": {
                "type": "remote",
                "url": "$MCP_GATEWAY_URL",
                "enabled": true,
                "headers": {
                  "Authorization": "Bearer $MCP_SENTINEL_TOKEN_NAME"
                }
              }
            }
          }
          EOF
      user: "agent"
      description: Register the sandbox MCP gateway in ~/.config/opencode/opencode.json

# The runtime's generated AGENTS.md baseline can't be replaced from the kit
# grammar — the entrypoint above rebuilds the file instead (kit copy +
# ~/.sbx-agents.d/ mixin notes).
agentInstructions:
  filename: AGENTS.md
