# Sandbox kit: OpenCode agent on the go template.
#
# PUBLISHED VARIANT — what remote consumers fetch at a release tag:
#   git+https://github.com/nikcio/docker-sandboxing.git#dir=kit-published-go&ref=vX.Y.Z
#
# sandbox.image points at the public template image on Docker Hub, built and
# pushed by .github/workflows/publish-image.yml when a release is published.
# release-please bumps the version + image tag between the x-release-please
# markers. Keep in sync with ../kit-go/spec.yaml (the dev kit).
#
# The kit is intentionally thin: template image + entrypoint. Everything
# shared across the kits lives in ../mixins/ as small, pick-and-choose
# mixins — this kit requires these three:
# - ../mixins/opencode-entrypoint/ — the entrypoint runtime (banner,
#   opencode autostart, .env guard, mixin hook runner)
# - ../mixins/base/ — agent guidance files, the AGENTS.md rebuild hook,
#   and the MCP gateway registration
# - ../mixins/opencode-config/ — the permissive OpenCode config
# The entrypoint below execs the shared runtime script and refuses to
# start (with a clear error) if the entrypoint mixin is missing. Compose
# further capabilities at launch with the mixins from ../mixins/ via
# --kit flags or a .sbxenv.yaml kits: list (the spec's `mixins:` field is
# not applied by the runtime yet). See ../docs/.
#
# Validate: sbx kit validate kit-published-go/
schemaVersion: "2"
kind: sandbox
name: opencode-go
displayName: OpenCode (Go)
description: >
  OpenCode agent running on a custom template with the Go toolchain preinstalled. Requires the shared mixins (../mixins/opencode-entrypoint,
  ../mixins/base, ../mixins/opencode-config): the entrypoint is a login
  shell — it prints a startup banner, auto-starts opencode, and drops
  into the shell when opencode exits (relaunch with `o`); the base mixin
  rebuilds the sandbox AGENTS.md and registers the MCP gateway; the
  config mixin ships the permissive OpenCode config (edit/bash/webfetch
  allowed — the sandbox is the isolation boundary).
  Compose the mixins from ../mixins/ to add capabilities (model provider,
  network areas, workflow rules). Enforces a no-.env policy in the
  workspace: refuses to start in direct mode when one exists, removes it
  in clone mode.
# The version and the image tag are bumped together by release-please.
# x-release-please-start-version
version: 0.7.0

sandbox:
  # Public image on Docker Hub, pushed by the publish-image workflow
  # (full docker.io prefix — sbx does not resolve the Docker Hub domain).
  image: docker.io/nikcio/opencode-go:v0.7.0
# x-release-please-end-version
  # Wrapper: the real runtime lives in the opencode-entrypoint mixin
  # (~/.sandbox-kit/entrypoint.sh) — see that script for the behavior
  # (banner, auto-start opencode, drop into the shell when opencode exits;
  # quitting the shell ends the session).
  entrypoint:
    - bash
    - -c
    - |
      if [ -f "$HOME/.sandbox-kit/entrypoint.sh" ]; then
        exec bash "$HOME/.sandbox-kit/entrypoint.sh"
      fi
      echo "ERROR [entrypoint]: $HOME/.sandbox-kit/entrypoint.sh is missing." >&2
      echo "This kit requires the shared mixins in the sandbox's kits list:" >&2
      echo "mixins/opencode-entrypoint (runtime), mixins/base (guidance + MCP gateway)," >&2
      echo "mixins/opencode-config (permissive OpenCode config)." >&2
      echo "Add them and recreate the sandbox." >&2
      exec bash -il

# The runtime's generated AGENTS.md baseline can't be replaced from the kit
# grammar — the base mixin's rebuild hook rewrites the file instead (the
# base mixin's ~/.sandbox-agents.md + every mixin note in
# ~/.sbx-agents.d/); the entrypoint runtime sources it before opencode
# starts.
agentInstructions:
  filename: AGENTS.md
