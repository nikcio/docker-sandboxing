# Sandbox kit: OpenCode agent on the node template.
#
# DEV VARIANT — sandbox.image is the locally built template (see
# scripts/bootstrap.*). Remote consumers use ../kit-published-node/
# (public image on Docker Hub, bumped by release-please).
#
# The kit is intentionally thin: template image + entrypoint. Everything
# shared across the kits lives in ../mixins/ as small, pick-and-choose
# mixins:
# - ../mixins/base/ — required: the entrypoint runtime (mixin hook
#   runner, opencode autostart, login shell on exit), agent guidance
#   files, the AGENTS.md rebuild hook, and the MCP gateway registration
# - ../mixins/global-opencode-config/ — required with a model provider
#   (zeldoc, copilot): the permissive OpenCode config and the combined
#   provider config (OPENCODE_CONFIG merge)
# - ../mixins/env-guard/ — optional: the workspace .env guard
# - ../mixins/banner/ — optional: the startup banner (the examples
#   compose env-guard and banner)
# The entrypoint below execs the shared runtime script and refuses to
# start (with a clear error) if the base mixin is missing. Compose
# further capabilities at launch with the mixins from ../mixins/ via
# --kit flags or a .sbxenv.yaml kits: list (the spec's `mixins:` field is
# not applied by the runtime yet). See ../docs/.
#
# Validate: sbx kit validate kit-node/
schemaVersion: "2"
kind: sandbox
name: opencode-node
displayName: OpenCode (Node)
description: >
  OpenCode agent running on a custom template with Node.js via NVM, PNPM, and Git preinstalled. Requires the shared base mixin (../mixins/base): the entrypoint runs
  the composed mixins' hooks and auto-starts opencode (login shell on
  exit — relaunch with `o`), rebuilds the sandbox AGENTS.md, and
  registers the MCP gateway. Compose ../mixins/global-opencode-config
  when using a model provider (zeldoc, copilot): it ships the permissive
  OpenCode config (edit/bash/webfetch allowed — the sandbox is the
  isolation boundary) and merges the providers. ../mixins/env-guard adds
  the no-.env policy (refuses to start in direct mode when a .env file
  exists, removes it in clone mode); ../mixins/banner adds the startup
  banner. Compose the mixins from ../mixins/ to add capabilities (model
  provider, network areas, workflow rules).
version: 0.5.0

sandbox:
  # Local template built from ../template-node/Dockerfile. A registry push
  # needs the full reference (e.g. docker.io/<org>/opencode-node:v1).
  image: opencode-node:v1
  # Wrapper: the real runtime lives in the base mixin
  # (~/.sandbox-kit/entrypoint.sh) — see that script for the behavior
  # (mixin hooks, auto-start opencode, drop into the shell when opencode
  # exits; quitting the shell ends the session).
  entrypoint:
    - bash
    - -c
    - |
      if [ -f "$HOME/.sandbox-kit/entrypoint.sh" ]; then
        exec bash "$HOME/.sandbox-kit/entrypoint.sh"
      fi
      echo "ERROR [entrypoint]: $HOME/.sandbox-kit/entrypoint.sh is missing." >&2
      echo "This kit requires mixins/base (entrypoint runtime, agent guidance + MCP gateway) in the sandbox's kits list." >&2
      echo "Compose mixins/global-opencode-config when using a model provider (zeldoc, copilot);" >&2
      echo "mixins/env-guard adds the .env guard, mixins/banner the startup banner." >&2
      echo "Add the missing mixins and recreate the sandbox." >&2
      exec bash -il

# The runtime's generated AGENTS.md baseline can't be replaced from the kit
# grammar — the base mixin's rebuild hook rewrites the file instead (the
# base mixin's ~/.sandbox-agents.md + every mixin note in
# ~/.sbx-agents.d/); the entrypoint runtime sources it before opencode
# starts.
agentInstructions:
  filename: AGENTS.md
