# See https://docs.docker.com/ai/sandboxes/configuration/environment-files/

schemaVersion: "1"
name: docker-sandboxing
# The agent defined by this repo's sandbox kit (kit/spec.yaml `name:`).
agent: opencode-node-dotnet
# Composition: the sandbox kit (template + entrypoint) plus the area-specific
# mixins you want. Drop or add lines to scope the sandbox to your project —
# each mixin only contributes its own network rules, settings, and notes.
# Git refs fetch from github.com/nikcio/docker-sandboxing; pin with &ref=vX.Y.Z.
# When iterating from a clone, swap any ref for a local dir (e.g. ./kit).
kits:
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=kit                     # agent definition
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/opencode-runtime # agent runtime
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/zeldoc           # Zeldoc.ai provider
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/git              # git + worktrees
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/node             # node/npm
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/dotnet           # .NET/NuGet
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/docker           # in-sandbox docker
  - git+https://github.com/nikcio/docker-sandboxing.git#dir=mixins/apt              # apt mirrors
workspace: .

env:
  NODE_ENV: development

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 5000 # ASP.NET / dotnet run
    host: 5000
  - sandbox: 3000 # node / vite dev server
    host: 3000
