# Dev environment for iterating on this repo's kits and mixins.
#
# Unlike examples/opencode-node-dotnet.sbxenv.yaml (consumers, release-pinned
# refs, published image), this one loads the kits from the working copy and
# uses the locally built template image (scripts/bootstrap.* builds + loads it).
# Run:  sbx env run

schemaVersion: "1"
name: docker-sandboxing
agent: opencode-node-dotnet

kits:
  - ./kit-node-dotnet                 # agent definition (dev kit, local image)
  - ./mixins/base                     # entrypoint runtime + agent guidance + MCP gateway
  - ./mixins/global-opencode-config   # permissive OpenCode config + provider merge
  - ./mixins/env-guard                # workspace .env guard
  - ./mixins/banner                   # startup banner
  - ./mixins/opencode-runtime         # agent runtime
  - ./mixins/zeldoc                   # Zeldoc.ai provider
  - ./mixins/git                      # git + worktrees
  - ./mixins/uniform                  # uniform.app platform + docs (proxy-managed key)
  - ./mixins/node                     # node/npm
  - ./mixins/dotnet                   # .NET/NuGet
  - ./mixins/python                   # python + uv (PyPI egress)
  - ./mixins/go                       # go (module proxy egress)
  - ./mixins/rust                     # rust (crates.io + rustup egress)
  - ./mixins/docker                   # in-sandbox docker
  - ./mixins/apt                      # apt mirrors (+ background cache warm)
  - ./mixins/sbx                      # sbx CLI (kit authoring inside the sandbox)
  - ./mixins/open-egress              # allow all outbound domains (dev convenience)

workspace:
  path: .
  clone: false # true = sandbox works on its own copy (safer: the agent cannot touch your local folder)

env:
  NODE_ENV: development

sandboxOptions:
  cpus: 4
  memory: 8g

ports:
  - sandbox: 5000 # ASP.NET / dotnet run
    host: 5000
  - sandbox: 3000 # node / vite dev server
    host: 3000

# GitHub token for the sandbox: provision with
# `sbx secret set github --sandbox docker-sandboxing` (see docs/github-pat.md).
# Uniform API key for the sandbox: provision with
# `sbx secret set uniform` (see docs/uniform-api-key.md).
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com
        - uploads.github.com
        - raw.githubusercontent.com
  uniform:
    apiKey:
      domains:
        - uniform.app
        - eu.uniform.app
        - uniform.global
        - eu.uniform.global
